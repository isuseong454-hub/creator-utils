function cardHtml(i){
  const cap=esc(i.text||(i.url?(i.title||host(i.url)):''));
  const hasMemo=i.memo&&i.memo.trim();
  const views='';
  const memoBtn=hasMemo?`<button class="cc-memo" data-memo="${i.id}">＋ 메모</button>`:'';
  const memoPop=hasMemo?`<div class="cc-mpop"><span class="cc-mx" data-mclose="${i.id}">✕</span>${esc(i.memo)}</div>`:'';
  const photo=i.img?`<div class="cc-photo" style="background-image:url('${(i.img||'').replace(/'/g,'%27')}')"></div><div class="cc-grad"></div>`:'';
  const link=(i.url&&i.text)?`<div class="cc-link">🔗 ${esc(host(i.url))}</div>`:'';
  const done=isDone(i);
  let doneBtn='';
  if(i.ws==='idea'){
    if(done) doneBtn=`<button class="cc-runflag done" data-done="${i.id}">✓ 실행함</button>`;
    else if(isRun(i)) doneBtn=`<span class="cc-runflag inq">🏃 실행 모음</span>`;
    else doneBtn=`<button class="cc-runner" data-torun="${i.id}" aria-label="실행 모음으로 담기"><span class="cc-orbit"></span><span class="cc-ripple"></span>${RUNNER_SVG}</button>`;
  }
  // 🎨 타이포 타일: 사진 없는 글 카드는 유형 색으로 물들이고 글자를 크게 (스크롤·인식 개선)
  const isText=!i.img;
  const tcol=isText?ideaGroupColor(i.group):'';
  const tcat=(isText && i.group && i.group!=='유형 미지정')?`<span class="cc-tcat" style="color:${tcol}">${esc(i.group)}</span>`:'';
  const tileStyle=isText?` style="background:linear-gradient(158deg,${tcol}22,#131313);border-color:${tcol}2e"`:'';
  return`<div class="ccard ${i.fav?'fav':''} ${i.img?'':'notxt tile'} ${done?'checked':''}" data-id="${i.id}"${tileStyle}>
    ${photo}
    <button class="cc-fav" data-fav="${i.id}">${i.fav?'★':'☆'}</button>
    ${i.ws==='idea'?`<button class="cc-pin${isPin(i)?' on':''}" data-pin="${i.id}" title="할일 포스트잇으로 꽂기">📌</button>`:''}
    ${views}${memoBtn}${tcat}
    <div class="cc-cap">${cap||'<span class="cc-e">(내용 없음)</span>'}${link}</div>
    ${doneBtn}
    ${memoPop}
  </div>`;
}

/* ── 집필 모드(자동): 마감일 정한 미완성 책이 있으면 켜짐 ── */
function activeWritingBook(){
  const bs=(store.books||[]).filter(b=>b.targetDate && b.chapters && ebProgress(b).pct<100);
  if(!bs.length)return null;
  bs.sort((a,b)=>new Date(a.targetDate)-new Date(b.targetDate));
  return bs[0];
}
function nextUnwrittenSec(b){
  for(const c of (b.chapters||[])) for(const s of (c.secs||[])) if(s.status!=='done') return {c,s};
  return null;
}
function nhContHtml(){

function wireHome(){
  const ta=document.getElementById('nhTa'),sv=document.getElementById('nhSave'),go=document.getElementById('nhGo');
  if(!ta)return;
  const grow=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,Math.round(window.innerHeight*0.44))+'px';};
  const upd=()=>{const ti=document.getElementById('nhTitle');
    const has=ta.value.trim().length>0||nhShots.length>0||(ti&&ti.value.trim().length>0);
    sv.disabled=!has;go.disabled=!has;grow();};
  nhUpd=upd;
  ta.addEventListener('input',upd);
  ta.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();if(!sv.disabled)sv.click();}});
  /* 📷 붙여넣기 · 드래그 — 여러 장 그대로 */
  ta.addEventListener('paste',async e=>{
    const cd=e.clipboardData;if(!cd)return;
    let fs=cd.files&&cd.files.length?[...cd.files]:[...(cd.items||[])]
      .filter(x=>x.type&&x.type.indexOf('image')===0).map(x=>x.getAsFile());
    fs=fs.filter(f=>f&&f.type&&f.type.indexOf('image')===0);
    if(!fs.length)return;      // 글 붙여넣기는 그대로
    e.preventDefault();await nhAddShots(fs);
  });
  ta.addEventListener('dragover',e=>e.preventDefault());
  ta.addEventListener('drop',async e=>{
    const fs=e.dataTransfer&&e.dataTransfer.files?[...e.dataTransfer.files].filter(f=>f.type&&f.type.indexOf('image')===0):[];
    if(!fs.length)return;e.preventDefault();await nhAddShots(fs);
  });
  const ti=document.getElementById('nhTitle');
  /* ✍️ 초안 복원 — 워크스페이스 갔다 와도 쓰던 글 그대로 */
  const dft=nhReadDraft();
  if(dft){
    if(ti&&dft.title)ti.value=dft.title;
    if(dft.text)ta.value=dft.text;
    if(Array.isArray(dft.shots)&&dft.shots.length){nhShots=dft.shots.slice();}
    if(dft.cat)nhCat=dft.cat;
    nhHls=Array.isArray(dft.hls)?dft.hls.map(r=>r.slice()):[];    // 칠해둔 형광도 함께 복원
  }
  if(ti)ti.addEventListener('input',()=>{upd();nhSaveDraft()});
  /* 제목 → 본문. 한글 조합 중 엔터는 preventDefault하면 IME가 깨지므로 keyup에서 넘긴다 */
  let tiArm=false;
  if(ti)ti.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
    if(e.isComposing||e.keyCode===229){tiArm=true;return;}
    e.preventDefault();ta.focus();});
  if(ti)ti.addEventListener('keyup',e=>{if(e.key==='Enter'&&tiArm){tiArm=false;ta.focus();}});
  /* 🖍 거울판: 글을 고치면 칠한 구간도 따라 움직이고, 스크롤도 같이 */
  nhPrevLen=(ta.value||'').length; nhRenderMirror();
  ta.addEventListener('input',()=>{
    const len=ta.value.length, d=len-nhPrevLen;
    if(d){ const pos=Math.max(0,ta.selectionStart-Math.max(0,d)); nhHlShift(pos,d); nhPrevLen=len; }
    nhRenderMirror(); nhSaveDraft();
  });
  ta.addEventListener('scroll',()=>{const m=document.getElementById('nhMirror');if(m)m.scrollTop=ta.scrollTop;},{passive:true});
  /* # 키워드 태그 입력 */
  const kwIn=document.getElementById('nhKwIn'); nhRenderKw();
  /* ⌨️ 한글 엔터 — 조합 중(IME) 엔터는 keydown에서 무시되던 버그. 그땐 «예약»해 두고 keyup에서 처리
     (2026-07-27: 한글로 치면 엔터가 한 번에 안 먹던 원인) */
  let kwArm=false;
  if(kwIn)kwIn.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      if(e.isComposing||e.keyCode===229){kwArm=true;return;}      // 한글 조합 중 → keyup에서
      e.preventDefault();nhAddKw(kwIn.value);kwIn.value='';return;
    }
    if(e.key===','){e.preventDefault();nhAddKw(kwIn.value);kwIn.value='';return;}
    if(e.key==='Backspace'&&!kwIn.value&&nhKw.length){nhKw.pop();nhRenderKw();}});
  if(kwIn)kwIn.addEventListener('keyup',e=>{
    if(e.key==='Enter'&&kwArm){kwArm=false;nhAddKw(kwIn.value);kwIn.value='';}});
  sv.addEventListener('click',()=>{const t=ta.value.trim();const tt=ti?ti.value.trim():'';
    if(kwIn&&kwIn.value.trim()){nhAddKw(kwIn.value);kwIn.value='';}   // 안 누른 마지막 키워드도 담기
    if(!t&&!nhShots.length&&!tt)return;
    homeQuickSave(t,tt,nhKw.slice());nhClearDraft(true);ta.value='';if(ti)ti.value='';nhShots=[];nhCat='';nhKw=[];nhHls=[];nhPrevLen=0;nhRenderMirror();nhRenderKw();nhRenderShots();upd();ta.focus();
    ritualFx(homeMode==='diary');                                   // 저장 리추얼
    const c=document.getElementById('nhCont');                       // 담긴 뒤에야 「이어서」 등장
    if(c) setTimeout(()=>c.classList.add('show'),620);});
  go.addEventListener('click',()=>{const t=ta.value.trim();const tt=ti?ti.value.trim():'';
    if(!t&&!nhShots.length&&!tt)return;nhClearDraft(true);homeGoWrite(t,tt);});
  /* ↩ 방금 비운 글 되돌리기 (실수로 날렸을 때) */
  const und=document.getElementById('nhUndo');
  if(und){ let hasPrev=false; try{hasPrev=!!localStorage.getItem(NH_PREV)}catch(e){}
    und.classList.toggle('show', hasPrev && !ta.value.trim() && !(ti&&ti.value.trim())); }
  if(und)und.onclick=()=>{
    let p=null; try{p=JSON.parse(localStorage.getItem(NH_PREV)||'null')}catch(e){}
    if(!p){toast('되돌릴 글이 없어요');return}
    if(ti)ti.value=p.title||''; ta.value=p.text||'';
    nhShots=Array.isArray(p.shots)?p.shots.slice():[]; nhCat=p.cat||'';
    nhHls=Array.isArray(p.hls)?p.hls.map(r=>r.slice()):[]; nhPrevLen=ta.value.length; nhRenderMirror();
    nhRenderShots(); upd(); nhSaveDraft(); ta.focus();
    try{localStorage.removeItem(NH_PREV)}catch(e){}
    toast('↩ 되돌렸어요');
  };
  nhRenderShots();
  /* ▾ 하단 펼침: 유형 고르기 + 실행 모음 / 전자책 미분류로 보내기 */
  const box=document.querySelector('.nh-box'), pull=document.getElementById('nhPull');
  if(pull&&box)pull.onclick=()=>{box.classList.toggle('sendopen');ebBuzz(5)};
  document.querySelectorAll('[data-nhcat]').forEach(b=>b.onclick=()=>{
    nhCat=(nhCat===b.dataset.nhcat)?'':b.dataset.nhcat;
    document.querySelectorAll('[data-nhcat]').forEach(x=>x.classList.toggle('on',x.dataset.nhcat===nhCat));
    ebBuzz(5);});
  const sendTo=(btn,tag,msg)=>{
    if(!btn)return;
    btn.onclick=()=>{
      const t=ta.value.trim(), tt=ti?ti.value.trim():'';
      if(!t&&!nhShots.length&&!tt){toast('내용을 먼저 써주세요');return}
      btn.classList.add('filed');
      setTimeout(()=>{
        /* 보내기 = «옮기기»가 아니라 «아이디어 노트에 저장 + 꼬리표» — 글은 노트에 그대로 남는다 */
        homeQuickSave(t,tt,[tag].concat(nhKw)); nhClearDraft(true);
        ta.value='';if(ti)ti.value='';nhShots=[];nhRenderShots();
        nhKw=[];nhHls=[];nhPrevLen=0;nhRenderKw();nhRenderMirror();
        nhCat='';if(box)box.classList.remove('sendopen');
        upd();toast(msg);render();
        ritualFx(homeMode==='diary');                 // 저장과 똑같은 «불 켜짐» 리추얼
      },380);
    };
  };
  sendTo(document.getElementById('nhRun'),'__run','✓ 아이디어 노트에 저장 · 🏃 실행에도 올렸어요');
  sendTo(document.getElementById('nhEbox'),'__ebox','✓ 아이디어 노트에 저장 · 📥 전자책 재료로 올렸어요');
  // 전구 토글: 쓰던 글 유지한 채 모드 전환
  const setMode=m=>{ if(homeMode===m)return; homeMode=m; try{localStorage.setItem('idf_homemode',m)}catch(e){}
    const keep=ta.value, keepT=ti?ti.value:''; render();
    const ta2=document.getElementById('nhTa'), ti2=document.getElementById('nhTitle');
    if(ti2)ti2.value=keepT;
    if(ta2){ta2.value=keep;ta2.dispatchEvent(new Event('input'));ta2.focus();} ebBuzz(5); };
  const mi=document.getElementById('nhModeIdea'),md=document.getElementById('nhModeDiary');
  if(mi)mi.onclick=()=>setMode('idea');
  if(md)md.onclick=()=>setMode('diary');
  requestAnimationFrame(grow);
}
/* ── 홈에 붙여넣은 사진들 (저장할 때 글 아래로 따라 들어감) ── */
let nhShots=[], nhUpd=null;
function nhRenderShots(){
  const w=document.getElementById('nhShots');if(!w)return;
  w.innerHTML=nhShots.map((u,i)=>`<div class="nh-shot" style="background-image:url('${String(u).replace(/'/g,"%27")}')">
    <span class="nh-shotn">${i+1}</span><button data-sx="${i}" aria-label="빼기">✕</button></div>`).join('');
  w.querySelectorAll('[data-sx]').forEach(b=>b.onclick=()=>{
    nhShots.splice(+b.dataset.sx,1);nhRenderShots();if(nhUpd)nhUpd();ebBuzz(5);});
}
async function nhAddShots(files){

/* ═══ 🖍 홈 형광 — «그 자리에서» 칠한다. 화면 이동 0 (2026-07-27 사장님 요청)
   글칸은 textarea라 색을 못 넣으므로, 뒤에 똑같은 글을 깐 «거울판»에 색을 칠해 비친다. ═══ */
let nhHls=[];        // 칠한 구간 [[start,end], …] (문자 위치)
let nhPrevLen=0;     // 글자 수 — 글을 고치면 구간도 따라 움직이게
function nhHlNorm(len){                              // 정리: 범위 밖 제거 + 겹침 합치기
  const rs=nhHls.map(r=>[Math.max(0,Math.min(r[0],len)),Math.max(0,Math.min(r[1],len))])
    .filter(r=>r[1]>r[0]).sort((a,b)=>a[0]-b[0]);
  const out=[];
  rs.forEach(r=>{const last=out[out.length-1];
    if(last&&r[0]<=last[1]) last[1]=Math.max(last[1],r[1]); else out.push(r.slice());});
  nhHls=out; return out;
}
function nhHlShift(pos,delta){                       // 글을 고치면 뒤쪽 구간을 밀거나 당김
  if(!delta)return;
  nhHls=nhHls.map(r=>{
    let[s,e]=r;
    if(pos<=s){s+=delta;e+=delta;}
    else if(pos<e){e+=delta;}
    return [s,Math.max(s,e)];
  });
}
function nhRenderMirror(){
  const ta=document.getElementById('nhTa'), mr=document.getElementById('nhMirror');
  if(!ta||!mr)return;
  const t=ta.value||'', rs=nhHlNorm(t.length);
  let html='',p=0;
  rs.forEach(r=>{ html+=esc(t.slice(p,r[0]))+'<mark>'+esc(t.slice(r[0],r[1]))+'</mark>'; p=r[1]; });
  html+=esc(t.slice(p));
  mr.innerHTML=html+'\n';                            // 마지막 줄바꿈 보정
  mr.scrollTop=ta.scrollTop;                         // 글칸이 스크롤되면 거울도 같이
}
function nhHlHere(){
  const ta=document.getElementById('nhTa'); if(!ta)return;
  const s=ta.selectionStart,e=ta.selectionEnd;
  if(s===e){toast('먼저 글자를 드래그해주세요');return}
  const hit=nhHls.findIndex(r=>s<r[1]&&e>r[0]);      // 이미 칠한 곳이면 → 지우기
  if(hit>-1){
    const keep=[]; nhHls.forEach(r=>{
      if(!(s<r[1]&&e>r[0])){keep.push(r);return}
      if(r[0]<s)keep.push([r[0],s]);
      if(r[1]>e)keep.push([e,r[1]]);
    });
    nhHls=keep; toast('형광 지웠어요');
  }else{ nhHls.push([s,e]); toast('🖍 형광 ✓'); }
  nhRenderMirror(); nhSaveDraft(); ebBuzz(6);
  ta.focus(); try{ta.setSelectionRange(s,e)}catch(x){}   // 선택 유지 · 이동 없음
}
/* 저장할 때 칠한 구간을 <mark>로 굳힌다
   ⚠️ 저장은 ta.value.trim() 한 글을 넘겨받으므로, 앞에서 잘려나간 공백만큼 구간을 당겨야 안 밀린다 */
function nhHlToHtml(t){
  t=t||'';
  const enc=x=>esc(x).replace(/\n/g,'<br>');
  const ta=document.getElementById('nhTa'), raw=ta?(ta.value||''):t;
  let off=0;
  if(raw!==t){ const i=raw.indexOf(t); if(i>0) off=i; }        // 앞 공백이 잘린 만큼
  const rs=nhHlNorm(raw.length)
    .map(r=>[r[0]-off,r[1]-off])
    .map(r=>[Math.max(0,Math.min(r[0],t.length)),Math.max(0,Math.min(r[1],t.length))])
    .filter(r=>r[1]>r[0]);
  if(!rs.length)return enc(t);
  let out='',p=0;
  rs.forEach(r=>{out+=enc(t.slice(p,r[0]))+'<mark class="eb-hl lime">'+enc(t.slice(r[0],r[1]))+'</mark>';p=r[1];});
  return out+enc(t.slice(p));
}

function ebSmartType(){const sel=window.getSelection();if(!sel.rangeCount)return;const r=sel.getRangeAt(0);const n=r.startContainer;if(n.nodeType!==3)return;const o=r.startOffset,t=n.textContent;
  /* textContent 직접 수정 금지 — execCommand여야 Ctrl+Z 스택에 남는다 */
  const swap=(len,ch)=>{const rr=document.createRange();rr.setStart(n,o-len);rr.setEnd(n,o);
    sel.removeAllRanges();sel.addRange(rr);
    try{document.execCommand('insertText',false,ch)}catch(x){}};
  if(o>=2&&t.slice(o-2,o)==='--')swap(2,'—');
  else if(o>=3&&t.slice(o-3,o)==='...')swap(3,'…');}

  if(txt==='#')kind='h2';else if(txt==='---')kind='divider';else if(txt==='-'||txt==='*')kind='list';else if(txt==='>')kind='quote';
  if(!kind)return;e.preventDefault();
  const rr=document.createRange();rr.setStart(n,0);rr.setEnd(n,o);
  sel.removeAllRanges();sel.addRange(rr);

    c.innerHTML='<span class="od-s">'+'0123456789'.split('').map(d=>'<i>'+d+'</i>').join('')+'</span>';
    el.insertBefore(c,el.firstChild); cols=el.querySelectorAll('.od-c');}

function ideaDoDelete(g,move){

  else { inside.forEach(i=>{i.group=''}); }

/* ═══ 유리 위 팝오버 — 중요도 · 색 · 확인 (애플식으로 부드럽게 열림) ═══ */
function bdPopClose(){

function bdPop(id,card){
  bdPopClose();
  const it=store.items.find(x=>x.id===id), board=document.getElementById('bdBoard');
  if(!it||!board||!card)return;
  let imp=(it.bdi==='hi'||it.bdi==='lo')?it.bdi:'mid';
  let col=BD_COLORS.some(c=>c.k===it.bdc)?it.bdc:'yellow';
  const scrim=document.createElement('div'); scrim.className='bd-popscrim'; scrim.id='bdPopScrim';
  scrim.onclick=bdPopClose; board.appendChild(scrim);
  const p=document.createElement('div'); p.className='bd-pop'; p.id='bdPop';
  p.innerHTML=`<div class="pl">중요도</div>
    <div class="segs">${BD_IMPS.map(x=>`<button data-imp="${x.k}" class="${x.k===imp?'on':''}">${x.nm}</button>`).join('')}</div>
    <div class="pl">색 <span style="font-weight:700;color:#9aa093">= 유형</span></div>
    <div class="cols">${BD_COLORS.map(c=>`<button data-col="${c.k}" class="${c.k===col?'on':''}" title="${c.nm}" aria-label="${c.nm}" style="background:${c.c}"></button>`).join('')}</div>
    <button class="okb" id="bdPopOk">확인</button>`;

  /* 카드 옆에 붙이되, 판 밖으로 안 나가게 */
  const br=board.getBoundingClientRect(), cr=card.getBoundingClientRect();
  const W=224, H=p.offsetHeight||230;
  let x=cr.left-br.left, y=cr.bottom-br.top+10;
  x=Math.max(6,Math.min(x,board.clientWidth-W-6));
  if(y+H>board.clientHeight-6) y=Math.max(6,cr.top-br.top-H-10);   // 아래 자리 없으면 위로
  p.style.left=x+'px'; p.style.top=y+'px';
  void p.offsetWidth; p.classList.add('on'); ebBuzz(6);
  const paint=()=>{
    p.querySelectorAll('[data-imp]').forEach(b=>b.classList.toggle('on',b.dataset.imp===imp));
    p.querySelectorAll('[data-col]').forEach(b=>b.classList.toggle('on',b.dataset.col===col));
    card.className='bd-pinCard bd-pc '+(col==='yellow'?'':'c-'+col)+' '+(imp==='mid'?'':'bd-imp-'+imp);
    card.dataset.imp=imp; card.dataset.col=col;
    const lb=card.querySelector('.bd-lb'); if(lb)lb.textContent=(imp==='hi'?'☀️ 중요':imp==='lo'?'나중':'🏃 할 것');
  };
  p.querySelectorAll('[data-imp]').forEach(b=>b.onclick=()=>{imp=b.dataset.imp;paint();ebBuzz(5)});
  p.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{col=b.dataset.col;paint();ebBuzz(5)});
  document.getElementById('bdPopOk').onclick=()=>{
    it.bdi=imp; it.bdc=col; save(); bdPopClose(); ebBuzz(12);
    card.animate?card.animate([{transform:'rotateY(0deg)'},{transform:'rotateY(180deg)'},{transform:'rotateY(360deg)'}],
      {duration:420,easing:'cubic-bezier(.3,.9,.3,1)'}):0;
    toast(imp==='hi'?'☀️ 중요로 올렸어요':imp==='lo'?'나중으로 내렸어요':'보통으로 뒀어요');
  };
}
/* 붉은 실 — 같은 유형끼리 이어준다 (사건 보드처럼, 늘어진 곡선) */
function bdDrawStrings(){
  const svg=document.getElementById('bdStrings'), board=document.getElementById('bdBoard');
  if(!svg||!board)return;
  const br=svg.getBoundingClientRect();          // SVG(=판 안쪽) 기준 — 테두리 포함 크기로 재면 넘침
  svg.setAttribute('viewBox',`0 0 ${Math.round(br.width)} ${Math.round(br.height)}`);
  svg.removeAttribute('width'); svg.removeAttribute('height');
  const byGrp={};
  board.querySelectorAll('.bd-pinCard').forEach(c=>{
    const g=c.dataset.grp; if(!g)return;
    const r=c.getBoundingClientRect();
    (byGrp[g]=byGrp[g]||[]).push({x:r.left-br.left+r.width/2, y:r.top-br.top+10});
  });
  let d='';
  Object.keys(byGrp).forEach(g=>{
    const pts=byGrp[g]; if(pts.length<2)return;
    pts.sort((a,b)=>a.x-b.x);
    for(let k=0;k<pts.length-1;k++){
      const a=pts[k],b=pts[k+1], mx=(a.x+b.x)/2, sag=Math.min(26,Math.abs(b.x-a.x)*0.18+9);
      d+=`M${a.x.toFixed(1)} ${a.y.toFixed(1)} Q${mx.toFixed(1)} ${(Math.max(a.y,b.y)+sag).toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)} `;
    }
  });
  svg.innerHTML=d?`<path d="${d}"/>`:'';
}

/* 보드 배선 — 드래그 꽂기·도장 쾅·해냄 시트·판 정리 */
let _bdSlam=null;
function bindBoard(){
  const board=document.getElementById('bdBoard'); if(!board)return;
  const addb=document.getElementById('bdAdd'); if(addb)addb.onclick=ideaQuickAdd;
  document.querySelectorAll('[data-bdt]').forEach(c=>{
    c.addEventListener('pointerdown',e=>{
      if(e.target.closest('.bd-x'))return;          // ✕(삭제)는 드래그 시작 안 함
      e.preventDefault();
      const id=c.dataset.bdt;
      const g=c.cloneNode(true);g.classList.add('bd-ghost');g.style.width=c.offsetWidth+'px';
      document.body.appendChild(g);c.classList.add('ghosted');
      const mv=ev=>{g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';
        const r=board.getBoundingClientRect();
        board.classList.toggle('dropon',ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom);};
      const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
        g.remove();
        const r=board.getBoundingClientRect();
        const over=ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom;
        board.classList.remove('dropon');
        if(!over){c.classList.remove('ghosted');return;}
        const it=store.items.find(x=>x.id===id); if(!it){c.classList.remove('ghosted');return;}
        const W=Math.min(168,board.clientWidth*0.4);
        let x=ev.clientX-r.left-W/2, y=ev.clientY-r.top-14;

        it.bdp={x:+(x/board.clientWidth*100).toFixed(2), y:+(y/board.clientHeight*100).toFixed(2)};
        _bdSlam=id; save(); ebBuzz(14); render();

      board.classList.add('thud');}

    card.appendChild(st); void st.offsetWidth; st.classList.add('on'); ebBuzz(24);
    /* 자국 좌표는 «떼기 전»에 확보 */
    const r=card.getBoundingClientRect(), br=board.getBoundingClientRect();
    const hx=(r.left+r.width/2-br.left)/br.width*100, hy=Math.max(1,(r.top-br.top-3)/br.height*100);
    /* 도장 찍고 → 종결함으로 날아가 꽂힌다 */
    setTimeout(()=>{
      const vault=document.getElementById('bdVault');
      if(vault){
        const vr=vault.getBoundingClientRect();
        const dx=(vr.left+vr.width/2)-(r.left+r.width/2), dy=(vr.top+vr.height*0.35)-(r.top+r.height/2);
        card.classList.add('fly');
        card.style.transform=`translate(${dx.toFixed(0)}px,${dy.toFixed(0)}px) rotate(-13deg) scale(.18)`;
        setTimeout(()=>{vault.classList.add('pop');ebBuzz(10)},430);
      }else card.style.opacity='0';
    },380);
    setTimeout(()=>{
      const bd=bdData();
      bd.holes.push({x:+hx.toFixed(2), y:+hy.toFixed(2), ts:Date.now(), txt:ago(Date.now())+' · '+bdRunCap(it).slice(0,26)+' ✓'});
      if(!Array.isArray(it.tags))it.tags=[];
      if(!it.tags.includes('__done'))it.tags.push('__done');
      it.tags=it.tags.filter(t=>t!=='__run'); it.doneAt=Date.now(); delete it.bdp;
      save(); toast('🎉 해냄! 종결함에 쌓였어요'); render();
    },1120);
  });
  /* 포스트잇: 끌면 이동 · 그냥 누르면 설정 팝오버 (PPT·인스타 편집기 느낌)
     — 5px 넘게 움직이면 «드래그», 안 움직였으면 «탭»으로 갈라준다 */
  document.querySelectorAll('.bd-pinCard').forEach(card=>{
    card.addEventListener('pointerdown',e=>{
      if(e.target.closest('.bd-x')||e.target.closest('.bd-doneb'))return;
      e.preventDefault();
      const id=card.dataset.bdpin, it=store.items.find(x=>x.id===id); if(!it)return;
      const br=board.getBoundingClientRect(), cr=card.getBoundingClientRect();
      const offX=e.clientX-cr.left, offY=e.clientY-cr.top;
      const sx=e.clientX, sy=e.clientY; let moved=false;
      const mv=ev=>{

      const up=ev=>{

    });

  document.querySelectorAll('[data-bddel]').forEach(b=>b.onclick=e=>{e.stopPropagation();

    store.items=store.items.filter(x=>x.id!==id);
    save(); ebBuzz(6); render(); toast('🗑 삭제했어요');
  });
  /* 🖼 사진 전체 치우기 / 다시 올리기 — 사진이 80장씩 되니 하나씩 뺄 순 없다 */

    const bd=bdData(); bd.photosOff=!bd.photosOff;
    if(!bd.photosOff)bd.hidePhotos=[];            // 다시 올릴 땐 개별 숨김도 초기화
    save(); ebBuzz(8); render();
    toast(bd.photosOff?'🖼 사진을 판에서 치웠어요':'🖼 사진을 다시 올렸어요');
  };
  /* 폴라로이드 ✕ = 보드에서만 빼기 (원본 사진은 글·갤러리에 그대로) */
  document.querySelectorAll('[data-bdunpola]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const bd=bdData(); if(!Array.isArray(bd.hidePhotos))bd.hidePhotos=[];

    if(bd.hidePhotos.indexOf(src)<0)bd.hidePhotos.push(src);
    save(); ebBuzz(6); render(); toast('보드에서 뺐어요 — 글 속 원본은 그대로예요');
  });
  const vt=document.getElementById('bdVault'); if(vt)vt.onclick=bdDoneSheet;

  };
  bdDrawStrings();
  clearTimeout(bindBoard._st); bindBoard._st=setTimeout(bdDrawStrings,120);   // 폰트·레이아웃 확정 후 한 번 더
  if(!bindBoard._rs){bindBoard._rs=1;window.addEventListener('resize',()=>{clearTimeout(bindBoard._rt);bindBoard._rt=setTimeout(bdDrawStrings,140)});}

    h.classList.add('say'); setTimeout(()=>h.classList.remove('say'),1400)});

/* 해냄 시트 — 나무 머리(새김눈) + 해낸 목록 + ↺ 되돌리기 */
function bdDoneSheet(){
  const list=doneItems(), n=list.length;
  const grp=(k,five)=>{let s='<div class="bds-tg">';
    for(let i=0;i<Math.min(k,4);i++)s+='<span class="bds-tm"></span>';
    if(five)s+='<span class="bds-tm five"></span>'; return s+'</div>';};
  let tks=''; const full=Math.floor(n/5), rest=n%5;
  for(let g=0;g<Math.min(full,8);g++)tks+=grp(5,true);
  if(rest&&full<8)tks+=grp(rest,false);
  if(full>8)tks+='<span style="font-size:10px;color:#d8c9a8;font-weight:800">+'+(n-40)+'</span>';
  const rows=list.slice(0,60).map(i=>{

      <button class="bds-undo" data-bdundo="${i.id}">↺ 되돌리기</button></div>`;

  ov.innerHTML=`<div class="bds-c" onclick="event.stopPropagation()">

    ${rows||'<div class="bds-empty">아직 해낸 기록이 없어요 — 첫 하나를 꽂아보세요</div>'}
  </div>`;
  document.body.appendChild(ov);
  ov.onclick=()=>ov.remove();
  ov.querySelectorAll('[data-bdundo]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const it=store.items.find(x=>x.id===b.dataset.bdundo); if(!it)return;

    delete it.doneAt;
    save(); ov.remove(); render(); toast('↺ 실행 대기로 되돌렸어요 — 트레이에 있어요');
  });

  return pinTop+sortBarHtml()+ideaGroupHtml(seg,items);

/* 🖼 갤러리 = 내가 글에 넣은 사진들의 자동 나열 (수집이 아니라 조망) + 지난 수집 사진 */
function ideaAllPhotos(){
  const out=[],seen=new Set();
  const push=(src,ts)=>{if(!src||seen.has(src))return;seen.add(src);out.push({src,ts:ts||0})};
  const pull=(html,ts)=>{if(!html||html.indexOf('<img')<0)return;
    const d=document.createElement('div');d.innerHTML=html;

function ebUndoSnap(body,immediate){

  const doSnap=()=>{ const top=ebUndoSt.stack[ebUndoSt.stack.length-1];
    if(top&&top.h===body.innerHTML)return;
    ebUndoSt.stack.push({h:body.innerHTML,c:ebUndoCaret(body)});
    if(ebUndoSt.stack.length>120)ebUndoSt.stack.shift();

  if(!redo){
    const top=st[st.length-1];
    if(top&&top.h!==body.innerHTML) st.push({h:body.innerHTML,c:ebUndoCaret(body)});   // 마지막 타이핑도 스냅
    if(st.length<2)return false;

    if(!ebUndoSt.redo.length)return false;
    const nx=ebUndoSt.redo.pop(); st.push(nx);

}

/* ── 커서를 항상 화면 안에 — 쓰는 줄이 하단 바에 가려지지 않게 ── */
function tkCaretIntoView(){
  const sc=document.getElementById('tkScroll'),body=document.getElementById('thinkBody');
  if(!sc||!body)return;
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||!body.contains(sel.anchorNode))return;
  let r=sel.getRangeAt(0).getBoundingClientRect();
  if(!r||(!r.height&&!r.top)){                   // 빈 줄이면 그 줄의 블록으로 대체
    let n=sel.anchorNode; if(n&&n.nodeType===3)n=n.parentNode;
    if(n&&n.getBoundingClientRect)r=n.getBoundingClientRect();
  }
  if(!r||(!r.height&&!r.top))return;
  const box=sc.getBoundingClientRect();
  const bottomGuard=box.bottom-28;               // 하단바는 이제 스크롤 밖(흐름 안)이라 작은 여백만
  const topGuard=box.top+24;
  if(r.bottom>bottomGuard) sc.scrollTop+=(r.bottom-bottomGuard);
  else if(r.top<topGuard) sc.scrollTop-=(topGuard-r.top);
}
/* ── 🖍 형광: 드래그 후 e e (두 번) — Ctrl+E는 Ctrl+R(새로고침) 옆이라 폐기 ── */
let tkEE=null;
function tkEEKey(e,body){
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return false;
  if(e.code!=='KeyE')return false;                       // 한/영 무관하게 물리 E 키
  const sel=window.getSelection();

  else{const ch=(e.key&&e.key.length===1)?e.key:'';       // 한 번뿐이면 원래 하려던 글자 입력
    tkEE=setTimeout(()=>{tkEE=null;if(ch){try{document.execCommand('insertText',false,ch)}catch(x){}}},350);}

}

/* 클릭 지점의 «단어»를 골라 형광 토글 */
function tkHlWordAt(x,y){
  const body=ebActiveBody; if(!body)return;
  let pos=null;
  if(document.caretRangeFromPoint) pos=document.caretRangeFromPoint(x,y);
  else if(document.caretPositionFromPoint){const c=document.caretPositionFromPoint(x,y);
    if(c){pos=document.createRange();pos.setStart(c.offsetNode,c.offset);pos.collapse(true);}}
  if(!pos)return;
  let node=pos.startContainer, off=pos.startOffset;
  if(node.nodeType!==3){    // 텍스트가 아니면(이미지 등) 무시
    if(node.childNodes[off]&&node.childNodes[off].nodeType===3){node=node.childNodes[off];off=0;} else return;
  }
  const txt=node.nodeValue||''; if(!txt.trim())return;
  const isW=ch=>ch&&!/\s/.test(ch);
  let s=off,e=off;
  while(s>0&&isW(txt[s-1]))s--;
  while(e<txt.length&&isW(txt[e]))e++;
  if(s===e){e=Math.min(txt.length,off+1);s=Math.max(0,off);}   // 경계면 한 글자
  if(s>=e)return;
  const r=document.createRange();r.setStart(node,s);r.setEnd(node,e);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
  ebHl();   // 이미 형광이면 해제, 아니면 칠함
}
/* ── 🍎 시트 스와이프 닫기 (아래로 끌어 내리기, 잡아서 되돌리기) ── */
function tkDragSheet(panel, closeFn){
  if(!panel)return;
  const grab=panel.querySelector('.ebimg-grab,.grip')||panel;
  let sy=0,cur=0,lastY=0,lastT=0,vel=0;
  function move(e){let dy=e.clientY-sy; if(dy<0)dy*=0.35; cur=dy;
    panel.style.transform='translateY('+dy+'px)';
    const dt=Math.max(1,e.timeStamp-lastT); vel=(e.clientY-lastY)/dt*1000; lastY=e.clientY; lastT=e.timeStamp;}
  function up(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
    panel.classList.remove('eb-dragging');
    if(!isFinite(vel))vel=0;
    const proj=cur+vel*0.12;
    if(proj>panel.offsetHeight*0.38||vel>800){                 // 던지면 닫힘
      panel.style.transition='transform .2s cubic-bezier(.3,0,.5,1)';
      panel.style.transform='translateY('+(panel.offsetHeight+60)+'px)';
      setTimeout(()=>{try{closeFn()}catch(e){}},190);
    } else {                                                    // 아니면 스프링 복귀
      panel.style.transition='transform .32s cubic-bezier(.2,.9,.25,1.02)';
      panel.style.transform='';
      setTimeout(()=>{panel.style.transition=''},340);
    }}
  grab.addEventListener('pointerdown',function(e){
    if(e.target.closest('input,textarea,button,a,[contenteditable]'))return;
    sy=e.clientY;cur=0;lastY=e.clientY;lastT=e.timeStamp;vel=0;
    panel.classList.add('eb-dragging');panel.style.transition='';
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });
}

function idfDoBackup(){
  try{
    const html=idfBuildArchive();
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='아이디어폴더_백업_'+ymdKey(new Date())+'.html';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    const b=document.getElementById('idfBkSave'); if(b){const o=b.textContent;b.textContent='저장됐어요 ✓';setTimeout(()=>b.textContent=o,1600);}
    toast('백업 파일 저장 ✓ — 안전하게 보관하세요');
  }catch(e){toast('백업 실패 — 다시 시도해주세요');}
}
function idfCopyBackupPrompt(){
  const done=()=>{const b=document.getElementById('idfBkPrompt');if(b){const o=b.textContent;b.textContent='복사됐어요 ✓';setTimeout(()=>b.textContent=o,1600);}toast('프롬프트 복사 ✓ — ChatGPT에 붙여넣으세요');};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(IDF_BK_PROMPT).then(done,fb);}else fb();
  function fb(){const ta=document.createElement('textarea');ta.value=IDF_BK_PROMPT;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done();}
}
function idfRestore(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.html,.json,text/html,application/json';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        let txt=String(r.result||''),data=null;
        const m=txt.match(/<script id="idf-data"[^>]*>([\s\S]*?)<\/script>/);
        if(m){data=JSON.parse(m[1].replace(/\\u003c/g,'<'));}
        else{data=JSON.parse(txt);}
        const s=data&&data.store; if(!s||!Array.isArray(s.items))throw new Error('형식');
        const n=s.items.length,bk=(s.books||[]).length;
        if(!confirm('이 파일로 복원하면 지금 내용이 백업본으로 바뀝니다.\n\n글 '+n+'개 · 전자책 '+bk+'권\n\n복원할까요?'))return;
        store.items=s.items; store.books=s.books||[]; store.groups=s.groups||{}; store.hidGroups=s.hidGroups||{};
        if(s.bd)store.bd=s.bd; if(Array.isArray(s.tags))store.tags=s.tags;
        save(); toast('복원 완료 ✓ — 새로고침합니다'); setTimeout(()=>location.reload(),900);
      }catch(e){toast('이 파일은 복원할 수 없어요 — 백업 파일이 맞는지 확인해주세요');}
    };
    r.readAsText(f);
  };
  inp.click();
}

/* (담기 폼 이미지 붙여넣기 캡처 제거 — 사진은 글 안에만) */
/* ── 자동 카테고리 제안 (키워드 기반, AI 없이) ── */
const GROUP_KEYWORDS={
  '후킹':['후킹','훅','3초','첫문장','첫 문장','제목','시선','궁금','스크롤','멈추','도입'],
  '전환':['전환','구매','결제','상담','가격','세일즈','판매','클로징','설득','신청','예약'],
  '문제해결':['문제','고민','해결','불만','실수','어려','막히','안된','안 된','해결책'],
  '꿀팁':['팁','노하우','방법','쉽게','꿀팁','비법','요령'],
  '정보':['정보','통계','자료','데이터','분석','조사','근거','트렌드'],
  '강의':['강의','수업','커리큘럼','수강생','교육','과정','기수','강사'],
  '사업':['사업','매출','수익','창업','브랜드','마케팅','단가','운영'],
  '카피':['카피','문구','멘트','워딩','슬로건','한줄','한 줄'],
  '기획':['기획','구성','목차','설계','흐름','구조','뼈대'],
  '이미지 생성':['이미지','사진','썸네일','프롬프트','미드저니','생성형','ai그림']
};
function suggestGroup(text){
  const t=(text||'').toLowerCase();
  if(t.replace(/\s/g,'').length<4)return '';
  const avail=groupsFor('idea');
  let best='',score=0;
  for(const g in GROUP_KEYWORDS){
    if(!avail.includes(g))continue;
    let sc=0; GROUP_KEYWORDS[g].forEach(k=>{if(t.includes(k.toLowerCase()))sc++});
    if(sc>score){score=sc;best=g;}
  }
  return score>0?best:'';
}
function compSuggest(){
  const el=document.getElementById('cSuggest'); if(!el)return;
  if(cGroup&&cGroup!=='유형 미지정'){el.innerHTML='';return}          // 이미 고르면 숨김
  const t=(document.getElementById('uniText')?.value||'')+' '+(cMemoVal||'');
  const g=suggestGroup(t);
  if(!g){el.innerHTML='';return}
  el.innerHTML=`<span class="cs-t">💡 「<b>${esc(g)}</b>」 같아요</span><button class="cs-y" id="csYes">이걸로 분류</button>`;
  document.getElementById('csYes').onclick=()=>{cGroup=g;compGroups();compSuggest();ebBuzz(8);toast('「'+g+'」로 분류 ✓')};
}
function compGroups(){
  const groups=groupsFor(cWs);
  document.getElementById('cGroupRow').innerHTML=groups.map(g=>`<button class="co ${cGroup===g?'sel':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('');
  document.querySelectorAll('#cGroupRow .co').forEach(b=>b.onclick=()=>{cGroup=b.dataset.g;compGroups();compSuggest()});
}
function compAddGroup(){const inp=document.getElementById('cNewGroup');const v=inp.value.trim();if(!v)return;
  if(!store.groups[cWs])store.groups[cWs]=[];
  if(!groupsFor(cWs).includes(v)){store.groups[cWs].push(v);save()}
  cGroup=v;inp.value='';compGroups()}
function compTags(){
  document.getElementById('cTagRow').innerHTML=store.tags.map(t=>`<button class="co ${cTags.includes(t)?'sel':''}" data-t="${esc(t)}">#${esc(t)}</button>`).join('');
  document.querySelectorAll('#cTagRow .co').forEach(b=>b.onclick=()=>{const t=b.dataset.t;
    cTags=cTags.includes(t)?cTags.filter(x=>x!==t):[...cTags,t];compTags()});
}
function compAddTag(){const inp=document.getElementById('cNewTag');const v=inp.value.trim();if(!v)return;
  if(!store.tags.includes(v)){store.tags.push(v);save()}
  if(!cTags.includes(v))cTags.push(v);inp.value='';compTags()}
function compValidate(){
  const hasImg=!!cImg;
  const hasText=(document.getElementById('uniText')?.value.trim().length>0);
  const hasUrl=(document.getElementById('uniUrl')?.value.trim().length>0);
  const ok=(hasImg||hasText||hasUrl);
  const btn=document.getElementById('cSave');if(btn)btn.disabled=!ok;
  const rb=document.getElementById('cRun');if(rb)rb.disabled=!ok;}
function compSave(runFlag){
  const text=(document.getElementById('uniText')?.value||'').trim();
  let url=(document.getElementById('uniUrl')?.value||'').trim();
  const item={id:uid(),ws:cWs,group:cGroup||'유형 미지정',ts:Date.now(),fav:false,uses:0,tags:[...cTags]};
  if(cImg)item.img=cImg;
  if(text)item.text=text;
  if(url){if(!/^https?:\/\//.test(url))url='https://'+url;item.url=url;item.title=host(url)}
  if(cViewsVal)item.views=cViewsVal;
  if(cMemoVal.trim())item.memo=cMemoVal.trim();
  item.type=cImg?'image':(item.url?'link':'idea');
  if(runFlag){item.tags.push('__run');ebBuzz(10);}     // 🏃 빠르게 실행하기 = 실행 모음으로도
  store.items.unshift(item);save();
  lastAddedId=item.id;lastWs=cWs;
  // stay on home; just refresh so the new card lands in 최근
  render();
  const w=WS.find(x=>x.key===cWs);
  toast(runFlag?'🏃 담고 · 실행 모음으로 보냈어요':('담았어요 ✓  ·  '+w.title+'에 저장'));
}

function compressImage(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
  const MAX=1280;let w=img.width,h=img.height;
  if(w>h&&w>MAX){h=Math.round(h*MAX/w);w=MAX}else if(h>=w&&h>MAX){w=Math.round(w*MAX/h);h=MAX}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  cb(c.toDataURL('image/jpeg',0.82))};img.src=r.result};r.readAsDataURL(file)}
function loadImg(file){compressImage(file,data=>{curImg=data;imgzone.classList.add('filled');
  imgzone.innerHTML=`<img src="${data}"><button class="rm" id="rmImg">삭제</button>`;
  document.getElementById('rmImg').onclick=e=>{e.stopPropagation();clearImg()};updateSave()})}
function clearImg(){curImg=null;imgzone.classList.remove('filled');imgzone.innerHTML='';

let toastT,toastT2;
function toast(msg){const t=document.getElementById('toast');if(!t)return;
  clearTimeout(toastT);clearTimeout(toastT2);
  t.textContent=msg;
  t.style.width='auto';
  const w=Math.min(t.scrollWidth+2, window.innerWidth-32);   // 텍스트에 맞는 목표 폭
  t.style.width='38px';                                       // 점 알약에서 출발
  t.classList.add('show');
  void t.offsetWidth;                                         // 리플로우 강제 → 폭 전환 시작
  t.style.width=w+'px';
  toastT=setTimeout(()=>{t.style.width='38px';t.classList.remove('show')},1700);
  toastT2=setTimeout(()=>{t.style.width='auto'},2400);
}
  // 어디서나 복사(HTTPS면 clipboard, 아니면 textarea+execCommand 폴백)
  function copyText(t,msg){
    const ok=()=>toast(msg||'복사됨 ✓');
    try{ if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(t).then(ok,()=>fb()); return; } }catch(e){}
    fb();
    function fb(){ try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;opacity:0;top:0'; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); ta.remove(); ok(); }catch(e){ toast('복사 실패 — 길게 눌러 복사하세요'); } }
  }

(function(){

  const GRACE_MS = 3*86400000;        // ⏳ 만료 후 3일 유예 (사장님 지시)

    try{ localStorage.setItem(THEME_KEY, t.key); }catch(e){}
  }
  applyTheme(localStorage.getItem(THEME_KEY)||'lime');   // 부팅 시 저장된 테마 즉시 적용

  /* ---- 활동명(닉네임)을 헤더에 반영 ---- */

    if(h1){ h1.textContent = USER_NICK ? USER_NICK+'의 아이디어 폴더' : '아이디어 폴더'; }
    document.title = (USER_NICK ? USER_NICK+'의 ' : '') + '아이디어 폴더';
  }

  /* ---- 유틸 ---- */
  async function sha256(s){
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  function pubUrl(path){ return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; }
  function dataURLtoBlob(d){
    const [h,b]=d.split(','); const mime=(h.match(/:(.*?);/)||[])[1]||'image/jpeg';
    const bin=atob(b), u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return new Blob([u],{type:mime});
  }
  /* ---- 전자책 이미지 업로드 헬퍼(버킷) — 전자책 코드에서 호출 ---- */
  window.__idfUpload = async function(blob){
    try{
      if(!sb || !CURRENT) return null;
      const path = CURRENT+'/bk_'+((crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2))+'.jpg';
      const {error} = await sb.storage.from(BUCKET).upload(path, blob, {contentType:'image/jpeg', upsert:true});
      if(error) return null;
      return pubUrl(path);
    }catch(e){ return null; }
  };
  function rowToItem(r){
    const it={ id:r.id, ws:r.ws, group:r.grp||'유형 미지정',
      ts:r.created_at?Date.parse(r.created_at):Date.now(),
      fav:!!r.fav, uses:r.uses||0, tags:Array.isArray(r.tags)?r.tags:[],
      type:r.type||'idea' };
    if(r.text) it.text=r.text;
    if(r.title) it.title=r.title;
    if(r.url){ it.url=r.url; if(!it.title) it.title=host(r.url); }
    if(r.memo) it.memo=r.memo;
    if(r.views) it.views=r.views;
    if(r.img_path){ it._imgPath=r.img_path; it.img=pubUrl(r.img_path); }
    bdUnpack(it, it.tags);                       // 📌 보드 위치·색·중요도 되살리기
    return it;
  }
  function itemToRow(it){
    return { id:it.id, user_code:CURRENT, ws:it.ws, grp:it.group||'유형 미지정',
      type:it.type||'idea', text:it.text||null, url:it.url||null, title:it.title||null,
      img_path:it._imgPath||null, memo:it.memo||null, views:it.views||null,
      /* ⚠️ 작성 시각을 반드시 함께 보낸다 — 안 보내면 저장할 때마다 서버가 now()로 다시 찍어
         노트의 «쓴 날짜»가 오늘로 바뀌어 버림(달력·날짜별 목록이 뒤죽박죽). 2026-07-27 수정 */
      created_at:new Date(it.ts||Date.now()).toISOString(),
      /* 📌 실행 보드 3속성(위치·색·중요도)을 tags에 실어 보낸다 — 서버 칼럼을 안 늘리고 폰↔PC 동기화.
         `__bd:` 로 시작하는 태그는 화면에 안 보이고(visibleTags가 __ 숨김) 불러올 때 다시 풀어낸다. 2026-07-27 */
      tags:bdPack(it), fav:!!it.fav, uses:it.uses||0 };
  }
  /* 보드 속성 → 태그로 접기 / 태그 → 보드 속성으로 펴기 */
  function bdPack(it){
    const t=(Array.isArray(it.tags)?it.tags:[]).filter(x=>typeof x==='string'&&x.indexOf('__bd:')!==0);
    if(it.bdp&&typeof it.bdp.x==='number') t.push('__bd:p:'+it.bdp.x+','+it.bdp.y);
    if(it.bdc) t.push('__bd:c:'+it.bdc);
    if(it.bdi) t.push('__bd:i:'+it.bdi);
    return t;
  }
  function bdUnpack(it,tags){
    const keep=[];
    (tags||[]).forEach(function(x){
      if(typeof x!=='string'||x.indexOf('__bd:')!==0){keep.push(x);return}
      const v=x.slice(5);
      if(v.indexOf('p:')===0){const a=v.slice(2).split(',');const px=parseFloat(a[0]),py=parseFloat(a[1]);
        if(!isNaN(px)&&!isNaN(py)) it.bdp={x:px,y:py};}
      else if(v.indexOf('c:')===0) it.bdc=v.slice(2);
      else if(v.indexOf('i:')===0) it.bdi=v.slice(2);
    });
    it.tags=keep;
  }
  /* ---- 📌 실행 보드: 판 상태(자국·종결·사진 설정)를 한 행(ws='board')으로 동기화 ----
     책과 같은 방식. id는 계정마다 고정이라 기기가 달라도 같은 행을 덮어쓴다. 2026-07-27 */
  const BD_ROW_ID='00000000-0000-4000-8000-0000000b0a4d';
  function boardToRow(){
    const bd=(typeof store!=='undefined'&&store.bd)?store.bd:null;
    return { id:BD_ROW_ID, user_code:CURRENT, ws:'board', grp:'판', type:'board',
      text:JSON.stringify(bd||{}), url:null, title:null, img_path:null,
      memo:null, views:null, tags:[], fav:false, uses:0,
      created_at:new Date(0).toISOString() };   // 목록·달력에 안 섞이게 아주 옛날 날짜
  }
  /* ---- 전자책: 책 전체를 한 행(ws='book', text=JSON)으로 동기화 ---- */
  function bookToRow(b){
    return { id:b.id, user_code:CURRENT, ws:'book', grp:'책', type:'book',
      text:JSON.stringify(b), url:null, title:b.title||null, img_path:null,
      memo:null, views:null, tags:[], fav:false, uses:0 };
  }

  /* ---- 새 항목 id는 uuid로(=DB PK 호환) ---- */
  uid = ()=> (crypto.randomUUID ? crypto.randomUUID()
             : Date.now().toString(36)+Math.random().toString(36).slice(2,10));

  /* ---- save() 가로채기: 로컬 저장 + 클라우드 동기화 ---- */
  save = function(){ try{ _localSave(); }catch(e){} scheduleSync(); };

  let tmr=null, busy=false;
  function scheduleSync(){ if(!CURRENT) return; clearTimeout(tmr); tmr=setTimeout(runSync,450); }
  async function runSync(){
    if(!CURRENT || busy){ if(busy) scheduleSync(); return; }
    busy=true;
    try{
      // 1) 새 사진 업로드 (base64 → 버킷 → 공개 URL, localStorage 부담 제거)
      for(const it of store.items){
        if(it.img && it.img.indexOf('data:')===0 && !it._up){
          it._up=true;
          const path = CURRENT+'/'+it.id+'.jpg';
          const {error} = await sb.storage.from(BUCKET).upload(path, dataURLtoBlob(it.img),
            {contentType:'image/jpeg', upsert:true});

          delete it._up;
        }
      }
      // 1b) 본문 안에 인라인으로 박힌 base64 사진도 버킷으로 (저장공간 부담 제거)
      for(const it of store.items){
        if(it.text && it.text.indexOf('data:image')>=0){
          const srcs=[...new Set(it.text.match(/data:image\/[a-zA-Z0-9.+-]+;base64,[^"')\s]+/g)||[])];
          for(const s of srcs){
            try{
              const p = CURRENT+'/inl_'+((crypto&&crypto.randomUUID)?crypto.randomUUID():it.id+'_'+Math.random().toString(36).slice(2))+'.jpg';
              const {error} = await sb.storage.from(BUCKET).upload(p, dataURLtoBlob(s), {contentType:'image/jpeg', upsert:true});
              if(!error) it.text = it.text.split(s).join(pubUrl(p));
            }catch(e){}
          }
        }
      }
      try{ _localSave(); }catch(e){}
      // 2) 변경/추가 → upsert (항목 + 전자책)
      const rows=[], ids=new Set();
      for(const it of store.items){
        ids.add(it.id);
        const snap=JSON.stringify(itemToRow(it));
        if(shadow.get(it.id)!==snap) rows.push(itemToRow(it));
      }
      for(const b of (store.books||[])){
        ids.add(b.id);
        const snap=JSON.stringify(bookToRow(b));
        if(shadow.get(b.id)!==snap) rows.push(bookToRow(b));
      }
      /* 📌 판 상태도 한 행으로 */
      { const br=boardToRow(), snap=JSON.stringify(br);
        ids.add(BD_ROW_ID);
        if(shadow.get(BD_ROW_ID)!==snap) rows.push(br); }
      if(rows.length){
        let done=false;
        if(TOKEN){ const r=await idfRpc('idf_items_upsert',{p_code:CURRENT,p_token:TOKEN,p_rows:rows});
          if(!r.legacy){ if(r.error) throw r.error; done=true; } }
        if(!done) await sb.from('idea_folder_items').upsert(rows);
      }
      // 3) 삭제 반영
      const del=[...shadow.keys()].filter(id=>!ids.has(id));
      if(del.length){
        let done=false;
        if(TOKEN){ const r=await idfRpc('idf_items_del',{p_code:CURRENT,p_token:TOKEN,p_ids:del});
          if(!r.legacy){ if(r.error) throw r.error; done=true; } }
        if(!done) await sb.from('idea_folder_items').delete().in('id',del);
      }
      // 4) shadow 갱신
      shadow.clear();
      for(const it of store.items) shadow.set(it.id, JSON.stringify(itemToRow(it)));
      for(const b of (store.books||[])) shadow.set(b.id, JSON.stringify(bookToRow(b)));
      shadow.set(BD_ROW_ID, JSON.stringify(boardToRow()));
    }catch(e){ /* 네트워크 오류 시 다음 저장 때 자동 재시도 */ }
    finally{ busy=false; }
  }

  async function loadCloud(code){

      if(!r.legacy){ if(r.error) throw r.error; data=r.data||[]; }

        .eq('user_code',code).order('created_at',{ascending:false});
      if(res.error) throw res.error;

    }
    const bookRows=(data||[]).filter(r=>r.ws==='book');
    const boardRow=(data||[]).find(r=>r.ws==='board');          // 📌 판 상태
    const itemRows=(data||[]).filter(r=>r.ws!=='book'&&r.ws!=='board');
    const cloud = itemRows.map(rowToItem);
    const cloudBooks = bookRows.map(r=>{ try{ return JSON.parse(r.text); }catch(e){ return null; } }).filter(Boolean);
    // 클라우드는 비었는데 이 기기에 로컬 데이터가 있으면 → 이사 제안
    if(cloud.length===0 && cloudBooks.length===0 && (store.items.length>0 || (store.books||[]).length>0)){

        render(); save(); return;   // save() 가 사진 업로드 + 동기화 수행
      }

    store.items = cloud;

    if(boardRow&&boardRow.text){

    for(const it of store.items) shadow.set(it.id, JSON.stringify(itemToRow(it)));
    for(const b of store.books) shadow.set(b.id, JSON.stringify(bookToRow(b)));
    shadow.set(BD_ROW_ID, JSON.stringify(boardToRow()));
    try{ _localSave(); }catch(e){}
    render();
    if(store.items.some(it=>it.text&&it.text.indexOf('data:image')>=0)) setTimeout(()=>{try{save()}catch(e){}},1200);

  }

  /* ---- 로그인 검증 (RPC 우선 · 구서버 폴백) ---- */
  async function tryLogin(code, pin){
    code=(code||'').trim().toUpperCase(); pin=(pin||'').trim();
    if(!code || !pin) return {ok:false, msg:'코드와 PIN을 입력하세요'};
    const r=await idfRpc('idf_login',{p_code:code,p_pin:pin});
    if(!r.legacy){
      if(r.error) return {ok:false, msg:'연결 오류 — 잠시 후 다시'};
      const d=r.data||{};
      if(!d.ok){
        const M={no_code:'없는 코드예요', wrong:'PIN이 달라요',
          locked:'시도가 많아 5분 잠겼어요 — 잠시 후 다시', expired:'만료된 코드예요 — 관리자에게 문의하세요'};
        return {ok:false, msg:M[d.msg]||'로그인 실패 — 다시 시도'};
      }
      CURRENT=code; TOKEN=d.token||null;
      return {ok:true, expiresAt:d.expires_at||null, mustSetPin:!!d.must_set_pin, name:d.name||''};
    }
    return tryLoginLegacy(code, pin);
  }
  async function tryLoginLegacy(code, pin){
    let row;
    try{
      const {data,error}=await sb.from('idea_folder_users').select('*').eq('code',code).maybeSingle();
      if(error) throw error; row=data;
    }catch(e){ return {ok:false, msg:'연결 오류 — 잠시 후 다시'}; }
    if(!row) return {ok:false, msg:'없는 코드예요'};
    let h=''; try{ h=await sha256(pin); }catch(e){}
    if(pin!==row.pin && h!==row.pin) return {ok:false, msg:'PIN이 달라요'};
    if(row.expires_at && Date.parse(row.expires_at) + GRACE_MS < Date.now())   // ⏳ 3일 유예
      return {ok:false, msg:'만료된 코드예요 — 관리자에게 문의하세요'};
    CURRENT=code; TOKEN=null;   // 세션 저장은 로그인 완전히 끝난 뒤(로그인 유지 체크 시)
    return {ok:true, expiresAt:row.expires_at||null, mustSetPin:!!row.must_set_pin, name:row.name||''};
  }

  // 한글 IME로 쳐도 그 키의 영문(두벌식)으로 변환 — 코드칸 전용
  function hangulToKeys(s){
    const CHO=['r','R','s','e','E','f','a','q','Q','t','T','d','w','W','c','z','x','v','g'];
    const JUNG=['k','o','i','O','j','p','u','P','h','hk','ho','hl','y','n','nj','np','nl','b','m','ml','l'];
    const JONG=['','r','R','rt','s','sw','sg','e','f','fr','fa','fq','ft','fx','fv','fg','a','q','qt','t','T','d','w','c','z','x','v','g'];
    const J={'ㄱ':'r','ㄲ':'R','ㄴ':'s','ㄷ':'e','ㄸ':'E','ㄹ':'f','ㅁ':'a','ㅂ':'q','ㅃ':'Q','ㅅ':'t','ㅆ':'T','ㅇ':'d','ㅈ':'w','ㅉ':'W','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g','ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'O','ㅓ':'j','ㅔ':'p','ㅕ':'u','ㅖ':'P','ㅗ':'h','ㅛ':'y','ㅜ':'n','ㅠ':'b','ㅡ':'m','ㅣ':'l'};
    let o='';for(let i=0;i<s.length;i++){const ch=s[i],c=ch.charCodeAt(0);
      if(c>=0xAC00&&c<=0xD7A3){const x=c-0xAC00;o+=CHO[Math.floor(x/588)]+JUNG[Math.floor((x%588)/28)]+JONG[x%28];}
      else if(J[ch])o+=J[ch];else o+=ch;}
    return o;
  }
  function codeClean(v){return hangulToKeys(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);}
  function wireCode(code,onFull){
    const done=()=>{ if(onFull&&code.value.length>=6)onFull(); };
    // 영문: keydown 물리키로 즉시 입력(값 강제쓰기 없음 → 자연스럽고 안 막힘)
    code.addEventListener('keydown',e=>{
      if(e.ctrlKey||e.metaKey||e.altKey)return;
      if(e.isComposing||e.keyCode===229)return;       // 한글 조합 중이면 IME에 맡김(중복 방지)
      let ch=null,m=/^Key([A-Z])$/.exec(e.code);
      if(m)ch=m[1];else{const d=/^(?:Digit|Numpad)([0-9])$/.exec(e.code);if(d)ch=d[1];}
      if(ch!=null){ e.preventDefault(); if(code.value.length<6){ code.value+=ch; done(); } }
      else if(e.code==='Backspace'){ e.preventDefault(); code.value=code.value.slice(0,-1); }
    });
    // 한글 확정/붙여넣기: 영어로 정리
    const cleanup=()=>{ const v=codeClean(code.value); if(v!==code.value)code.value=v; done(); };
    code.addEventListener('compositionend',cleanup);
    code.addEventListener('paste',()=>setTimeout(cleanup,0));
  }

        <div class="sp-label">나만의 PIN 4자리</div>${rowHtml}
        <div class="sp-label">다시 한 번</div>${rowHtml}
        <div class="idf-err" id="spErr"></div>
        <button id="spGo">시작하기</button>
      </div>`;
    document.body.appendChild(ov);
    const rows=[...ov.querySelectorAll('.idf-pins')].map(r=>[...r.querySelectorAll('.idf-pin')]);
    const [row1,row2]=rows;
    function wire(row,next){
      row.forEach((p,i)=>{
        p.addEventListener('input',()=>{ p.value=p.value.replace(/[^0-9]/g,'');
          if(p.value){ p.classList.add('filled'); pop(p); buzz(); if(i<3) row[i+1].focus(); else if(next) next.focus(); }
          else p.classList.remove('filled'); });
        p.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!p.value&&i>0){ e.preventDefault(); row[i-1].focus(); row[i-1].value=''; row[i-1].classList.remove('filled'); }
          else if(e.key==='Enter') go(); });
      });
    }
    wire(row1,row2[0]); wire(row2,null);
    const go=async()=>{
      const p1=row1.map(x=>x.value).join(''), p2=row2.map(x=>x.value).join('');
      const err=document.getElementById('spErr');
      if(p1.length<4){ err.textContent='새 PIN 4자리를 입력하세요'; return; }
      if(p1!==p2){ err.textContent='두 번 입력한 PIN이 서로 달라요'; buzz();
        const card=ov.querySelector('.idf-card'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        row2.forEach(x=>{x.value='';x.classList.remove('filled')}); row2[0].focus(); return; }
      const nick=(document.getElementById('spNick').value||'').trim() || (curName||'');
      const b=document.getElementById('spGo'); b.disabled=true; b.textContent='설정 중…';
      const fail=()=>{ err.textContent='저장 실패 — 다시 시도'; b.disabled=false; b.textContent='시작하기'; };
      const finish=async(exp,nm)=>{
        sessWrite(remember);
        ov.classList.add('done'); setTimeout(()=>ov.remove(),260); addLogoutBtn(exp); applyNick(nm);
        toast(nm?nm+'님, 환영해요 ✓':'설정 완료 ✓');
        try{ await loadCloud(CURRENT); }catch(e){ toast('불러오기 실패 — 새로고침 해주세요'); }
      };
      const r = TOKEN
        ? await idfRpc('idf_set_pin',{p_code:CURRENT,p_token:TOKEN,p_pin:p1,p_nick:nick})
        : await idfRpc('idf_first',{p_code:CURRENT,p_pin:p1,p_nick:nick});
      if(!r.legacy){
        if(r.error||!(r.data&&r.data.ok)){ fail(); return; }
        if(r.data.token) TOKEN=r.data.token;
        await finish(r.data.expires_at||expiresAt||null, nick); return;
      }
      try{ await sb.from('idea_folder_users').update({pin:p1, name:nick, must_set_pin:false}).eq('code',CURRENT); }
      catch(e){ fail(); return; }
      await finish(expiresAt, nick);
    };
    document.getElementById('spGo').onclick=go;
    setTimeout(()=>row1[0].focus(),320);
  }

  function addLogoutBtn(expiresAt){
    const brand=document.querySelector('header .brand');
    // ⚙ 설정 버튼
    let s=document.getElementById('idfGear');
    if(!s){ s=document.createElement('button'); s.id='idfGear'; s.title='설정'; s.setAttribute('aria-label','설정');
      s.innerHTML='⚙'; s.onclick=openSettings; (brand||document.body).appendChild(s); }
    /* 🔒 로그아웃은 헤더에서 뺐다 (2026-07-27) — 거의 안 쓰는데 위험한 버튼이 화면 맨 위에
       상시 노출돼 오탭 위험 + 자리 낭비였음. 이제 ⚙ 설정 맨 아래에 있음 (idfLogout) */
    const old=document.getElementById('idfOut'); if(old)old.remove();
    expiryNotice(expiresAt);
  }
  /* ⏳ 만료 신호 — 1달 전 한 번, 1주일 전부터는 하루 한 번 (사장님 지시 2026-07-26) */
  function expiryNotice(expiresAt){
    if(!expiresAt) return;                                      // 평생은 침묵
    const days=Math.ceil((Date.parse(expiresAt)-Date.now())/86400000);
    if(days<-3||days>31) return;   // 유예(-3일)까지 신호
    const key='idf_expnote_'+(CURRENT||'');
    let st=null; try{ st=JSON.parse(localStorage.getItem(key)||'null'); }catch(e){}
    const today=new Date().toISOString().slice(0,10);
    if(days>7){ if(st&&st.monthShown) return; }                 // D-31~8: 딱 한 번
    else { if(st&&st.day===today) return; }                     // D-7~: 하루 한 번
    try{ localStorage.setItem(key, JSON.stringify({monthShown:true, day:today})); }catch(e){}
    setTimeout(()=>showExpiryBanner(days), 1400);
  }
  function showExpiryBanner(days){
    if(document.getElementById('idfExpn')) return;
    const urgent=days<=7;
    const head= days<0 ? ('이용 기간이 끝났어요 · 유예 '+Math.max(0,3+days)+'일 남음')
      : days===0 ? '오늘 이용이 끝나요 · 이후 3일 유예'
      : urgent ? ('이용 기간이 '+days+'일 남았어요')
      : ('한 달 뒤(D-'+days+') 이용이 끝나요');
    const ov=document.createElement('div'); ov.id='idfExpn'; if(urgent)ov.classList.add('urgent');
    ov.innerHTML=`<span class="ex-ic">⏳</span>
      <div class="ex-m"><b>${head}</b>
        <span>연장하면 지금까지 쓰신 글 <b>그대로</b> 이어져요 — 글은 안전하게 보관 중</span>
        <button class="ex-cta" id="idfExpnGo">💬 카카오로 연장 문의</button></div>
      <button class="ex-x" id="idfExpnX" aria-label="닫기">✕</button>`;
    document.body.appendChild(ov);
    document.getElementById('idfExpnX').onclick=()=>ov.remove();
    document.getElementById('idfExpnGo').onclick=()=>{ try{ window.open('https://open.kakao.com/o/guXDaPFi','_blank'); }catch(e){} };
  }

    document.body.appendChild(ov);

    // 테마 스와치 — 누르면 즉시 미리보기(적용)
    ov.querySelectorAll('.set-sw').forEach(b=>b.onclick=()=>{
      ov.querySelectorAll('.set-sw').forEach(x=>x.classList.toggle('on',x===b));

  function randCode(){ const cs='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s='';

  function randPin(){ return String(Math.floor(1000+Math.random()*9000)); }
  function addMonthsISO(m){ const d=new Date(); d.setMonth(d.getMonth()+m); return d.toISOString(); }
  function fmtDate(iso){ if(!iso) return '평생'; const d=new Date(iso);
    return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate(); }
  function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y);
    g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
    g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
  /* 💡 카드 로고 = 라임 타일 + 벡터 전구 (canvas 이모지가 회색으로 죽는 문제 해결) */
  function cardBulb(g,x,y,s,tile,ink){
    g.save();
    g.fillStyle=tile; roundRect(g,x,y,s,s,Math.round(s*0.27)); g.fill();   // 라임 둥근 타일
    const cx=x+s/2, cy=y+s*0.42, r=s*0.2;
    g.strokeStyle=ink; g.fillStyle=ink; g.lineWidth=Math.max(3,s*0.055); g.lineCap='round'; g.lineJoin='round';
    g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.stroke();                 // 전구 유리
    g.beginPath();                                                          // 필라멘트 살짝
    g.moveTo(cx-r*0.4,cy+r*0.15); g.lineTo(cx,cy-r*0.35); g.lineTo(cx+r*0.4,cy+r*0.15); g.stroke();
    const by=cy+r+s*0.06;                                                   // 나사 밑동 2줄
    g.beginPath(); g.moveTo(cx-r*0.55,by); g.lineTo(cx+r*0.55,by); g.stroke();
    g.beginPath(); g.moveTo(cx-r*0.38,by+s*0.07); g.lineTo(cx+r*0.38,by+s*0.07); g.stroke();
    g.restore();
  }

  async function adminVerify(id,pw){
    id=(id||'').trim().toLowerCase(); pw=(pw||'').trim();
    if(!id||!pw) return false;
    const r=await idfRpc('idf_admin',{p_id:id,p_pw:pw,p_op:'ping',p_args:{}});
    if(!r.legacy){
      if(r.error) return false;
      if(r.data&&r.data.ok){ ADMIN_ID=id; ADMIN_PW=pw; return true; }
      return false;
    }
    try{
      const {data,error}=await sb.from('idea_folder_users').select('*').eq('code',id).maybeSingle();
      if(error||!data||!data.is_admin) return false;
      let h=''; try{ h=await sha256(pw); }catch(e){}
      if(pw!==data.pin && h!==data.pin) return false;
      ADMIN_ID=id; ADMIN_PW=pw; return true;
    }catch(e){ return false; }
  }

  async function createCode(name, durMonths){

  /* ── 🎁 발급 카드: 블랙 멤버십(1년·평생) / 도서관 카드(체험 1달) — 사장님 픽 2026-07-26 ── */
  function accTier(acc){ if(!acc.expires_at) return 'life'; if(acc.dur===1) return 'trial'; return 'year'; }

      g.fillStyle=gr; g.fillRect(0,0,W,H);

      g.fillStyle='#8a7a55'; g.font='800 26px '+F; g.textAlign='left';

      g.fillStyle='#6b5f42'; g.font='700 28px '+F; g.fillText('이용자', 70, 262);

  async function copyCardImage(acc){
    try{
      const c=drawCard(acc);
      const blob=await new Promise(r=>c.toBlob(r,'image/png'));
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      toast('🖼 카드 이미지 복사됨 — 카톡에 붙여넣으세요');
    }catch(e){ saveCardImage(acc); toast('복사가 안 되는 환경이라 파일로 저장했어요'); }
  }
  function saveCardImage(acc){
    drawCard(acc).toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b);
      a.download='아이디어폴더_'+(accTier(acc)==='trial'?'체험':'멤버십')+'_'+acc.code+'.png'; a.click();
      toast('이미지 저장됨 ✓'); },'image/png');
  }
  function codeCard(acc){
    const exp = acc.expires_at ? ('만료 '+fmtDate(acc.expires_at)) : '평생 이용';
    const wrap=document.createElement('div'); wrap.className='cc-wrap';
    const img=document.createElement('img');
    img.src=drawCard(acc).toDataURL('image/png');
    img.style.cssText='width:100%;border-radius:14px;display:block;margin:10px 0;box-shadow:0 10px 30px rgba(0,0,0,.5)';
    wrap.appendChild(img);
    const acts=document.createElement('div'); acts.className='cc-actions';
    acts.innerHTML=`
        <button class="adm-btn adm-primary" data-cc="imgcopy">🖼 이미지 복사</button>
        <button class="adm-btn" data-cc="img">📸 저장</button>
        <button class="adm-btn" data-cc="copy">텍스트</button>`;
    wrap.appendChild(acts);
    acts.querySelector('[data-cc="imgcopy"]').onclick=()=>copyCardImage(acc);
    acts.querySelector('[data-cc="img"]').onclick=()=>saveCardImage(acc);
    acts.querySelector('[data-cc="copy"]').onclick=()=>{
      const t=`[아이디어 폴더]\n로그인 코드: ${acc.code}\n기간: ${exp}\n\n※ 첫 접속: 앱에서 "처음이신가요? 비밀번호 설정" → 코드 입력 → 본인 비밀번호 설정`;
      if(navigator.clipboard) navigator.clipboard.writeText(t);
      toast('복사됨 ✓ — 카톡에 붙여넣기');
    };
    return wrap;
  }

  async function refreshList(){
    let data=null;
    const rl=await admOp('list');
    if(!rl.legacy){ data=(rl.data&&rl.data.rows)||[]; }
    else{ const res=await sb.from('idea_folder_users').select('*')
      .eq('is_admin',false).order('created_at',{ascending:false}); data=res.data; }
    ALL_ACC=data||[];
    const el=document.getElementById('admList'); if(!el) return;
    const q=(document.getElementById('admSearch')?.value||'').trim().toLowerCase();
    const f=document.querySelector('#admFilter button.sel')?.dataset.f||'all';
    const now=Date.now();
    const list=ALL_ACC.filter(a=>{
      const expired=a.expires_at && Date.parse(a.expires_at)<now;
      if(f==='active' && expired) return false;
      if(f==='expired' && !expired) return false;
      if(q) return (a.code||'').toLowerCase().includes(q) || (a.name||'').toLowerCase().includes(q);
      return true;
    });
    if(!list.length){ el.innerHTML='<div class="adm-empty">없음</div>'; return; }
    el.innerHTML=list.map(a=>{
      const life=!a.expires_at, exp=life?null:Date.parse(a.expires_at);
      const expired= exp!==null && exp<now;
      const dl= exp!==null? Math.ceil((exp-now)/86400000):null;
      const st = life?'<span class="st life">평생</span>'
        : expired?'<span class="st exp">만료</span>':('<span class="st ok">D-'+dl+'</span>');
      const pinState = a.must_set_pin
        ? `<span class="pw-wait">🔑 ${a.pin?('임시비번 '+esc(a.pin)+' · '):''}설정 대기중</span>`
        : `<span class="pw-done">🔒 비밀번호 설정 완료</span>`;
      return `<div class="adm-row" data-code="${a.code}">
        <div class="ar-main"><div class="ar-top"><button class="ar-code" data-act="copy" title="코드 복사">${a.code}<span class="ar-copy">📋</span></button> ${st}</div>
          <div class="ar-sub">${esc(a.name||'-')} · ${life?'평생':('만료 '+fmtDate(a.expires_at))}</div>
          <div class="ar-pw">${pinState}</div></div>
        <div class="ar-acts">
          <button data-act="ext6">+6개월</button>
          <button data-act="ext12">+1년</button>
          <button data-act="temp">임시비번</button>
          <button data-act="del" class="danger">삭제</button>
        </div></div>`;
    }).join('');
    el.querySelectorAll('.adm-row').forEach(row=>{
      const code=row.dataset.code;
      row.querySelectorAll('[data-act]').forEach(btn=>btn.onclick=async()=>{
        const act=btn.dataset.act;
        if(act==='copy'){ copyText(code,'코드 '+code+' 복사됨 ✓'); return; }
        if(act==='ext6') await extendCode(code,6);
        else if(act==='ext12') await extendCode(code,12);
        else if(act==='temp'){
          const rr=await admOp('temp',{code});
          if(!rr.legacy){
            if(rr.error||!(rr.data&&rr.data.ok)){ toast('발급 실패 — 다시'); return; }
            showTempPin(code, rr.data.temp);
          }else{
            const temp=randPin();
            const {error}=await sb.from('idea_folder_users').update({pin:temp, must_set_pin:true}).eq('code',code);
            if(error){ toast('발급 실패 — 다시'); return; }
            showTempPin(code, temp); // 안내 카드 (복사·저장)
          }
        }
        else if(act==='del'){ if(!confirm(code+' 계정을 삭제할까요?')) return;
          const rr=await admOp('del',{code});
          if(rr.legacy) await sb.from('idea_folder_users').delete().eq('code',code);
          else if(rr.error||!(rr.data&&rr.data.ok)){ toast('삭제 실패'); return; }
          toast('삭제됨'); }
        refreshList();
      });
    });
  }

      toast('복사됨 ✓ — 카톡에 붙여넣기');
    };
  }

  async function extendCode(code, months){
    const a=ALL_ACC.find(x=>x.code===code); if(!a) return;
    if(!a.expires_at){ toast('이미 평생 계정이에요'); return; }
    const rr=await admOp('extend',{code,months});
    if(!rr.legacy){
      if(rr.error||!(rr.data&&rr.data.ok)){ toast('연장 실패 — 다시'); return; }
      toast('+'+(months===12?'1년':months+'개월')+' 연장 ✓'); return;
    }
    const base=(Date.parse(a.expires_at)>Date.now())?new Date(a.expires_at):new Date();
    base.setMonth(base.getMonth()+months);
    await sb.from('idea_folder_users').update({expires_at:base.toISOString()}).eq('code',code);
    toast('+'+(months===12?'1년':months+'개월')+' 연장 ✓');
  }

      padding:13px 14px;box-shadow:0 14px 40px rgba(0,0,0,.55);display:flex;gap:11px;align-items:flex-start;
      animation:expnIn .5s var(--rspring)}
    #idfExpn.urgent{border-color:rgba(255,138,138,.5)}
    @keyframes expnIn{from{opacity:0;transform:translateX(-50%) translateY(-14px)}}
    #idfExpn .ex-ic{font-size:19px;flex:0 0 auto;margin-top:1px}
    #idfExpn .ex-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
    #idfExpn .ex-m>b{font-size:13.5px;font-weight:800;color:#E0B27A}
    #idfExpn.urgent .ex-m>b{color:#ffa8a8}
    #idfExpn .ex-m>span{font-size:11.5px;color:#a8a8a0;line-height:1.6}
    #idfExpn .ex-m>span b{color:#e8eadf}
    #idfExpn .ex-cta{margin-top:6px;align-self:flex-start;background:rgba(224,178,122,.14);border:1px solid rgba(224,178,122,.4);
      color:#E0B27A;border-radius:999px;font-family:inherit;font-size:11.5px;font-weight:800;padding:6px 13px;cursor:pointer}
    #idfExpn.urgent .ex-cta{background:rgba(255,138,138,.12);border-color:rgba(255,138,138,.4);color:#ffa8a8}
    #idfExpn .ex-x{background:none;border:0;color:#6a6a64;font-size:14px;cursor:pointer;padding:2px 4px;flex:0 0 auto}`;
  document.head.appendChild(st2);

  /* ---- 부팅: 관리자 문양 항상 표시 + 세션 자동로그인/로그인화면 ---- */
  ensureAdminDot();
  async function verifyAndLoad(sav){
    const code=(typeof sav==='string')?sav:sav.c;
    const tok=(typeof sav==='object'&&sav)?sav.t:null;
    if(tok){
      const r=await idfRpc('idf_session',{p_code:code,p_token:tok});
      if(!r.legacy){
        if(r.error){ addLogoutBtn(); toast('오프라인 — 저장된 내용 표시'); return; }
        const d=r.data||{};
        if(!d.ok){
          localStorage.removeItem(SESS); CURRENT=null; TOKEN=null;
          if(d.msg==='expired'){ try{ localStorage.removeItem(KEY); }catch(e){} }
          showLogin(); return;
        }
        TOKEN=tok;
        if(d.must_set_pin){ showSetPin(true, d.expires_at||null, d.name); return; }
        addLogoutBtn(d.expires_at||null); applyNick(d.name);
        await loadCloud(code); return;
      }
    }
    try{
      const {data,error}=await sb.from('idea_folder_users').select('*').eq('code',code).maybeSingle();
      if(error) throw error;
      if(!data || (data.expires_at && Date.parse(data.expires_at)+GRACE_MS<Date.now())){   // ⏳ 3일 유예
        localStorage.removeItem(SESS); try{ localStorage.removeItem(KEY); }catch(e){}
        CURRENT=null; showLogin(); return;
      }
      if(data.must_set_pin){ showSetPin(true, data.expires_at||null, data.name); return; }
      addLogoutBtn(data.expires_at||null); applyNick(data.name);
      await loadCloud(code);
    }catch(e){
      if(SRV===true){   // 서버는 잠겼는데 토큰 없는 옛 세션 → 한 번만 재로그인
        localStorage.removeItem(SESS); CURRENT=null; showLogin();
        toast('보안 업데이트 — 한 번만 다시 로그인해주세요'); return;
      }
      addLogoutBtn(); toast('오프라인 — 저장된 내용 표시');
    }
  }
  /* 🧹 로그인(앱 시작) 땐 홈 메모를 항상 빈칸으로 — 옛 임시저장 딸려오지 않게.
     (탭 전환 중 글 보존은 로그인 이후 동작이라 영향 없음 · 100자↑ 긴 글은 미분류로 자동보관돼 안 사라짐) */
  try{ localStorage.removeItem('idf_homedraft'); localStorage.removeItem('idf_homedraft_prev'); }catch(e){}
  const saved=sessRead();
  const _hn=location.hostname, _isPreview=(_hn==='localhost'||_hn==='127.0.0.1'||_hn==='0.0.0.0'||_hn===''||/^192\.168\./.test(_hn)||location.protocol==='file:');
  playIntro(INTRO_VARIANT, ()=>{
    if(saved){ CURRENT=saved.c; verifyAndLoad(saved); }
    else if(_isPreview && !/[?&]login\b/.test(location.search)){
      /* 🔧 미리보기(localhost) 전용 자동 로그인 — 실제 배포 사이트에선 절대 실행 안 됨. 주소 끝에 ?login 붙이면 로그인화면 강제. 배포 전 빼고 싶으면 이 블록만 지우면 됨 */
      tryLogin('ZD5GWY','2222').then(r=>{
        if(r&&r.ok&&!r.mustSetPin){ addLogoutBtn(r.expiresAt||null); applyNick(r.name); loadCloud(CURRENT).catch(()=>{}); toast('미리보기 자동 로그인 ✓'); }
        else showLogin();
      }).catch(()=>showLogin());
    }
    else{ showLogin(); }
  }, !!saved || (_isPreview && !/[?&]login\b/.test(location.search)));   // 세션 있으면(=자동로그인) 인트로 짧게
})();
</script>
