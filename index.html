<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0D0D0D">
<title>아이디어 폴더 · 고객관점</title>
<!-- 홈 화면 설치(PWA) — 2026-08-14 추가 -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="아이디어">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
/* 서비스 워커 등록 — 설치 가능 조건 충족용. 네트워크 우선이라 항상 최신이 뜬다 */
if('serviceWorker' in navigator){
  addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(function(){});
  });
}
</script>
<style>
  /* 프리미엄 한글 폰트 (온라인시 로드, 오프라인은 시스템폰트 폴백) */
  @font-face{font-family:'Pretendard';font-weight:45 920;font-style:normal;font-display:swap;
    src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2')}
  :root{
    --bg:#0D0D0D; --surface:#151515; --surface-2:#1c1c1c; --line:#2a2a2a;
    --ink:#e5e7dc; --ink-dim:#8a8d80; --ink-faint:#5a5c50;   /* 애플식 소프트 화이트 — 순백(#f2f2f0) 대신 살짝 꺼진 흰색 */
    --lime:#C8FF00; --lime-rgb:200,255,0; --lime-dim:#98c400;
    --img:#7ab8ff; --link:#ff9d5c; --idea:#c88bff;
    --gold:#ffd24a;
    --radius:16px; --radius-sm:10px;
    --font:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;
    -webkit-font-smoothing:antialiased;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}

  /* Header */
  header{position:sticky;top:0;z-index:40;background:rgba(13,13,13,.9);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);padding:calc(13px + env(safe-area-inset-top)) 0 12px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime);align-self:center}
  .brand-icon{width:46px;height:46px;border-radius:13px;align-self:center;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;padding:8px;
    background:radial-gradient(circle at 50% 42%,rgba(var(--lime-rgb),.2),#101206 72%);
    border:1px solid rgba(var(--lime-rgb),.5);box-shadow:0 0 18px rgba(var(--lime-rgb),.38),inset 0 0 12px rgba(var(--lime-rgb),.12)}
  .brand-icon svg{width:100%;height:100%;color:var(--lime);filter:drop-shadow(0 0 4px rgba(var(--lime-rgb),.7))}
  .brand h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
  .brand .sub{font-size:11px;color:var(--ink-faint);letter-spacing:.14em;font-weight:600;text-transform:uppercase}
  .count{margin-left:auto;font-size:12px;color:var(--ink-dim)}
  /* ═══ 헤더 다이어트 — 앱 이름·브랜드는 «홈»에서만. 다른 탭은 「N개 보관 + ⚙」만 (2026-07-27) ═══ */
  body.hdr-min header{padding-top:calc(9px + env(safe-area-inset-top));padding-bottom:9px}
  body.hdr-min .brand h1,body.hdr-min .brand .sub{display:none}
  body.hdr-min .brand-icon{width:30px;height:30px;border-radius:9px;padding:5px;box-shadow:0 0 10px rgba(var(--lime-rgb),.25)}
  body.hdr-min .count{font-size:12.5px}
  .count b{color:var(--lime);font-weight:700}
  .searchbar{margin-top:12px;display:flex;align-items:center;gap:9px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
  .searchbar svg{flex:0 0 auto;opacity:.5}
  .searchbar input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:15px;font-family:inherit}
  .searchbar input::placeholder{color:var(--ink-faint)}
  .searchbar .clr{background:none;border:none;color:var(--ink-faint);font-size:20px;cursor:pointer;padding:0 2px;line-height:1;display:none}

  /* Workspace title block */
  .ws-title{margin:20px 0 6px}
  .ws-title .wt-top{display:flex;align-items:center;gap:10px}
  .ws-title .wt-ic{font-size:24px}
  .ws-title h2{font-size:24px;font-weight:800;margin:0;letter-spacing:-.02em}
  .ws-title h2 em{color:var(--lime);font-style:normal}
  .ws-title .wt-desc{font-size:13px;color:var(--ink-dim);margin-top:7px;line-height:1.5}

  /* Sub-group section */
  main{padding:6px 0 30px}
  .subgrp{margin-bottom:26px}
  .sg-toggle{cursor:pointer;user-select:none}
  .sg-tw{font-size:11px;color:var(--ink-dim);transition:transform .2s;display:inline-block}
  .subgrp.collapsed .sg-tw{transform:rotate(-90deg)}
  .subgrp.collapsed .rail,.subgrp.collapsed .wlist,.subgrp.collapsed .wgrid{display:none}
  .wcat-add{width:100%;background:var(--surface);border:1px dashed var(--line);color:var(--ink-dim);
    border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin:2px 0 26px}
  .wcat-add:active{transform:scale(.99)}
  /* 노트형 카테고리 컨테이너 + 컴팩트 목록 */
  .wcat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:12px}
  .wcat .sg-head{margin:10px 2px}
  .wlist{display:flex;flex-direction:column;margin-bottom:6px}
  .wrow{display:flex;align-items:center;gap:11px;padding:11px 2px;border-top:1px dashed var(--line);cursor:pointer}
  .wrow:first-child{border-top:none}
  .wr-dot{width:7px;height:7px;border-radius:50%;background:var(--lime);flex:0 0 auto;margin:0 3px}
  .wr-dot.link{background:var(--link)}
  .wr-dot.add{width:auto;height:auto;background:none;color:var(--ink-faint);font-weight:800;font-size:15px;margin:0 1px}
  .wr-thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:0 0 auto}
  .wr-txt{flex:1;min-width:0}
  .wr-main{font-size:15px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .wr-sub{font-size:12px;color:var(--ink-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wr-act{display:flex;align-items:center;gap:2px;flex:0 0 auto}
  .wr-b{background:none;border:none;color:var(--ink-faint);font-size:15px;cursor:pointer;padding:5px 4px;line-height:1}
  .wrow.fav .wr-b.fav{color:var(--gold)}
  .wr-b.del{font-size:13px}
  .wr-use{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-dim);font-size:11px;font-weight:700;
    border-radius:13px;padding:5px 10px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .wr-use.on{color:var(--lime);border-color:rgba(var(--lime-rgb),.4)}
  .wrow.add .wr-main{color:var(--ink-dim)}
  /* ── 비주얼 카드 (컨텐츠·아이디어) ── */
  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px;margin-bottom:6px}
  @media(min-width:560px){ .wgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))} }
  .rail .ccard{flex:0 0 clamp(150px,42vw,190px)}
  .ccard{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
    background:linear-gradient(160deg,#1a1a1a,#0f0f0f);aspect-ratio:4/5;cursor:pointer;transition:transform .15s}
  .ccard:active{transform:scale(.985)}
  .ccard .cc-photo{position:absolute;inset:0;background-size:cover;background-position:center}
  .ccard .cc-grad{position:absolute;left:0;right:0;bottom:0;height:60%;
    background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.32),transparent);z-index:1}
  .ccard .cc-cap{position:absolute;left:0;right:0;bottom:0;padding:9px 10px;z-index:2;color:#fff;font-weight:700;
    font-size:12.5px;line-height:1.3;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .ccard.notxt .cc-cap{color:var(--ink);position:absolute;top:0;bottom:auto;padding:34px 11px 12px;
    -webkit-line-clamp:6;font-weight:600;font-size:13px}
  /* 🎨 타이포 타일 — 글이 곧 포스터 */
  .ccard.tile{background:linear-gradient(158deg,#181818,#121212)}
  .ccard.tile .cc-tcat{position:absolute;top:11px;left:11px;z-index:3;font-size:9.5px;font-weight:800;letter-spacing:.03em}
  .ccard.tile .cc-cap{top:0;bottom:auto;padding:30px 13px 40px;-webkit-line-clamp:5;
    font-weight:800;font-size:15px;letter-spacing:-.02em;line-height:1.42;color:#edefe7}
  .ccard.tile .cc-e{font-weight:600;color:var(--ink-faint)}
  .ccard.tile .cc-link{color:var(--link);font-weight:700}
  .ccard .cc-e{color:var(--ink-faint);font-weight:500}
  .ccard .cc-link{font-size:11px;color:var(--link);margin-top:4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ccard .cc-views{position:absolute;top:8px;right:8px;z-index:3;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);
    color:#fff;font-size:11px;font-weight:800;border-radius:14px;padding:3px 9px}
  .ccard .cc-fav{position:absolute;top:7px;left:7px;z-index:3;background:rgba(0,0,0,.42);border:none;
    width:26px;height:26px;border-radius:8px;color:#fff;font-size:13px;cursor:pointer;backdrop-filter:blur(4px)}
  .ccard.fav .cc-fav{color:var(--gold)}
  .ccard .cc-done{position:absolute;top:7px;right:7px;z-index:5;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.18);color:#fff;font-size:10px;font-weight:800;border-radius:12px;
    padding:4px 9px;cursor:pointer}
  .ccard .cc-done.on{background:#2ec27e;border-color:#2ec27e;color:#08210f}
  .ccard.checked .cc-photo,.ccard.checked .cc-cap{opacity:.5}
  .ccard.checked{border-color:rgba(46,194,126,.5)}
  .ccard.checked::after{content:'✓';position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
    font-size:44px;font-weight:900;color:rgba(46,194,126,.9);text-shadow:0 2px 12px rgba(0,0,0,.5);pointer-events:none}
  .ccard .cc-memo{position:absolute;left:8px;bottom:8px;z-index:3;background:rgba(200,139,255,.92);color:#0D0D0D;
    border:none;font-size:10px;font-weight:800;border-radius:12px;padding:4px 9px;cursor:pointer}
  .ccard .cc-mpop{position:absolute;inset:0;z-index:4;background:rgba(13,13,13,.96);padding:14px 12px;
    font-size:12.5px;color:var(--ink);display:none;overflow:auto;line-height:1.55}
  .ccard.memo-open .cc-mpop{display:block}
  .ccard .cc-mx{position:absolute;top:6px;right:9px;cursor:pointer;color:var(--ink-dim);font-size:13px}
  .ccard.add{border:1.5px dashed #383834;background:var(--surface);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;color:var(--ink-faint)}
  .ccard.add .a-plus{font-size:28px;font-weight:300;line-height:1}
  .ccard.add .a-t{font-size:13px;font-weight:700}
  .ccard.add:active{transform:scale(.98)}
  .ins-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin-top:20px;max-width:420px}
  .ins-hd{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:13px}
  .ins-nums{display:flex;gap:8px;margin-bottom:14px}
  .ins-stat{flex:1;background:#0e0e0e;border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center}
  .ins-stat b{display:block;font-size:20px;font-weight:800;color:var(--lime);line-height:1.1}
  .ins-stat span{font-size:10.5px;color:var(--ink-faint);font-weight:600}
  .ins-bars{display:flex;flex-direction:column;gap:7px}
  .ins-brow{display:flex;align-items:center;gap:8px}
  .ins-bic{font-size:13px;width:16px;text-align:center}
  .ins-bname{font-size:11.5px;color:var(--ink-dim);font-weight:700;width:52px}
  .ins-btrack{flex:1;height:7px;background:#0e0e0e;border-radius:5px;overflow:hidden}
  .ins-bfill{display:block;height:100%;background:rgba(var(--lime-rgb),.55);border-radius:5px;transition:width .4s}
  .ins-bn{font-size:11px;color:var(--ink-dim);font-weight:800;width:20px;text-align:right}
  .exec-bar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:0 0 18px}
  .exec-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .exec-t{font-size:13.5px;font-weight:800;color:var(--ink)}
  .exec-n{font-size:13px;font-weight:800;color:#2ec27e}
  .exec-track{height:9px;background:#0e0e0e;border-radius:6px;overflow:hidden}
  .exec-fill{height:100%;background:linear-gradient(90deg,#2ec27e,#5fe0a0);border-radius:6px;transition:width .4s ease}
  .exec-msg{font-size:11.5px;color:var(--ink-faint);margin-top:8px}
  .sortbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 18px}
  .sort-chip{background:var(--surface);border:1px solid var(--line);color:var(--ink-dim);
    border-radius:20px;font-size:12px;font-weight:700;padding:6px 13px;cursor:pointer;font-family:inherit;transition:.15s}
  .sort-chip:active{transform:scale(.95)}
  .sort-chip.on{background:rgba(var(--lime-rgb),.12);border-color:rgba(var(--lime-rgb),.45);color:var(--lime)}
  .sort-chip.favchip{margin-left:auto}
  .sort-chip.favchip.on{background:rgba(255,210,74,.14);border-color:rgba(255,210,74,.5);color:var(--gold)}
  .sg-head{display:flex;align-items:center;gap:8px;margin:0 2px 12px}
  .sg-head .sg-name{font-size:14px;font-weight:800}
  .sg-head .sg-n{font-size:11px;font-weight:800;color:var(--lime);background:rgba(var(--lime-rgb),.1);
    border:1px solid rgba(var(--lime-rgb),.25);border-radius:11px;min-width:22px;height:20px;
    display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
  .sg-head .sg-line{flex:1;height:1px;background:var(--line)}

  /* Horizontal scroll rail for cards */
  .rail{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
  .rail::-webkit-scrollbar{display:none}
  .rail>*{scroll-snap-align:start}

  /* Card — instagram 4:5 */
  .card{flex:0 0 clamp(150px,42vw,190px);border-radius:var(--radius);overflow:hidden;
    background:var(--surface);border:1px solid var(--line);position:relative;cursor:pointer;
    transition:.15s;display:flex;flex-direction:column}
  .card:active{transform:scale(.985)}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.4)}
  @media(prefers-reduced-motion:reduce){.card:hover{transform:none}}
  .card.fav-on{border-color:rgba(255,210,74,.5);box-shadow:0 0 0 1px rgba(255,210,74,.25)}
  .card .media{position:relative;aspect-ratio:4/5;background:#0a0a0a;overflow:hidden}
  .card.t-img .media img{width:100%;height:100%;object-fit:contain;display:block}
  .card.t-idea .media,.card.t-link .media,.card.t-prompt .media{
    display:flex;flex-direction:column;padding:13px;gap:9px}
  .card .t-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;align-self:flex-start}
  .t-idea .t-badge{background:rgba(200,139,255,.16);color:var(--idea)}
  .t-link .t-badge{background:rgba(255,157,92,.16);color:var(--link)}
  .t-prompt .t-badge{background:rgba(var(--lime-rgb),.14);color:var(--lime)}
  .card .body-txt{font-size:13px;color:var(--ink);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .t-prompt .body-txt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#d8ffb0}
  .t-link .link-title{font-size:13.5px;font-weight:700;color:var(--link);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .t-link .link-host{font-size:10.5px;color:var(--ink-faint);margin-top:auto;word-break:break-all}
  .card .cat-cap{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;z-index:2;
    background:linear-gradient(to top,rgba(0,0,0,.85),transparent);font-size:11px;color:#fff;font-weight:600;line-height:1.3}
  .card .card-linkdot{position:absolute;top:7px;left:38px;z-index:3;background:rgba(255,157,92,.9);
    width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px}
  .card .card-linkline{font-size:11px;color:var(--link);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* fav star top-left */
  .card .fav{position:absolute;top:7px;left:8px;z-index:3;background:rgba(0,0,0,.45);border:none;
    width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:14px;color:#fff;
    display:flex;align-items:center;justify-content:center;padding:0;backdrop-filter:blur(4px)}
  .card .fav.on{color:var(--gold)}
  /* delete top-right */
  .card .del{position:absolute;top:7px;right:8px;z-index:3;background:rgba(0,0,0,.45);border:none;
    width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:13px;color:#fff;
    display:flex;align-items:center;justify-content:center;padding:0;backdrop-filter:blur(4px);opacity:0;transition:.15s}
  .card:hover .del{opacity:1}

  /* Execution footer */
  .exec{border-top:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:8px;background:var(--surface)}
  .exec .status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
  .exec .status.wait{color:var(--ink-dim);background:var(--surface-2)}
  .exec .status.done{color:var(--lime);background:rgba(var(--lime-rgb),.12)}
  .exec .tally{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:1px;
    font-family:ui-monospace,monospace;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .exec .use-btn{background:var(--lime);color:#0D0D0D;border:none;border-radius:8px;
    padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer;transition:.12s;flex:0 0 auto}
  .exec .use-btn:active{transform:scale(.93)}

  /* Add card (dashed) */
  .card.add{border:1.5px dashed #383834;background:var(--surface);cursor:pointer;
    align-items:center;justify-content:center}
  .card.add .media{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:none;width:100%}
  .card.add:hover{border-color:var(--lime)}
  .card.add .a-plus{font-size:28px;color:var(--ink-faint);font-weight:300;line-height:1}
  .card.add:hover .a-plus{color:var(--lime)}
  .card.add .a-t{font-size:12px;color:var(--ink-faint);font-weight:700}

  .empty-hint{color:var(--ink-faint);font-size:13px;text-align:center;padding:40px 0}

  /* Home hero slot */
  .home-hero{padding:26px 0 6px;text-align:center}
  .home-hero .hh-lead{font-size:14px;color:var(--ink-dim);margin-bottom:18px;line-height:1.55}
  .home-hero .hh-lead b{color:var(--lime);font-weight:700}
  .hero-slot{position:relative;width:100%;aspect-ratio:4/5;max-width:300px;margin:0 auto;
    border:2px dashed #3a3a36;border-radius:22px;cursor:pointer;transition:.18s;
    background:radial-gradient(130% 130% at 50% 0%,rgba(var(--lime-rgb),.08),transparent 62%),var(--surface);

  .tabbar button .tb-l{font-size:10.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}

  /* Scrim + modal */

  /* 앱 전체 포인터/기울임 반응 앰비언트 광원 */

  .ebfoc-bring{position:relative;width:180px;height:180px;margin-bottom:8px}
  .ebfoc-bring svg{transform:rotate(-90deg)}
  .ebfoc-bring .bc{stroke:#1c2422}
  .ebfoc-bring .bf{stroke:#5CC9BE;transition:stroke-dashoffset 0ms linear,stroke .6s;filter:drop-shadow(0 0 8px rgba(92,201,190,.5))}
  .ebfoc-bmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ebfoc-bnum{font-size:34px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .ebfoc-blbl{font-size:11px;font-weight:800;margin-top:2px;color:#5CC9BE}
  .ebfoc-rtitle{font-size:19px;font-weight:900;color:var(--ink);margin-top:6px}
  .ebfoc-rtip{font-size:13px;color:var(--ink-dim);line-height:1.55;margin-top:8px;max-width:260px}
  .ebfoc-rtip b{color:#5CC9BE}
  .ebfoc-rrec{font-size:12px;color:var(--ink-faint);margin-top:14px}
  .ebfoc-rrec b{color:var(--gold-hi)}
  .ebfoc-start{margin-top:20px;background:var(--lime);color:#0b0b0b;border:none;border-radius:15px;font-family:inherit;font-weight:900;font-size:15px;padding:15px 34px;cursor:pointer;box-shadow:0 10px 26px rgba(var(--lime-rgb),.34)}

  /* ⑥ 색·디테일 정제 — 완성 링/게이지 부드럽게 */
  .eb-rf,.eb-bfill,.eb-exec-fill{transition:all .6s cubic-bezier(.2,.8,.2,1)}
  .eb-pvpage{padding-top:46px}

  /* ═══════════ 📷 사진 — 기본 가운데 · 정렬/크기/캡션 ═══════════ */
  .eb-edbody .eb-img,.eb-pvsb .eb-img{object-position:center;margin:16px auto}
  .eb-fig{margin:20px 0;display:flex;flex-direction:column;gap:7px;position:relative;cursor:pointer}
  .eb-fig img.eb-img{margin:0;max-width:100%;max-height:none;width:100%;height:auto;border-radius:11px;display:block}
  .eb-fig figcaption.eb-cap{font-size:12.5px;color:var(--ink-faint);line-height:1.55;outline:none;max-width:88%;min-height:1.2em}
  .eb-fig figcaption.eb-cap:empty::before{content:attr(data-ph);color:#3a3a36}
  .eb-fig figcaption.eb-cap:focus{color:var(--ink-dim)}
  .eb-fig.al{align-items:flex-start;text-align:left}
  .eb-fig.ac{align-items:center;text-align:center}
  .eb-fig.ar{align-items:flex-end;text-align:right}
  .eb-fig.sm img.eb-img{width:46%}
  .eb-fig.md img.eb-img{width:74%}
  .eb-fig.lg img.eb-img{width:100%}
  .eb-fig::after{content:'';position:absolute;inset:-6px;border-radius:14px;border:1.5px solid transparent;pointer-events:none;transition:.18s}
  .eb-fig:hover::after{border-color:rgba(var(--lime-rgb),.22)}
  .eb-fig.picked::after{border-color:rgba(var(--lime-rgb),.6);box-shadow:0 0 0 4px rgba(var(--lime-rgb),.07)}
  .eb-fighint{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.62);color:#e6e6e2;font-size:10.5px;font-weight:700;
    border-radius:99px;padding:4px 9px;opacity:0;transition:.18s;pointer-events:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .eb-fig:hover .eb-fighint{opacity:1}
  /* 사진 편집 시트 */
  .ebimg-ov{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    display:flex;align-items:flex-end;justify-content:center;animation:ebimgfade .18s ease}
  @keyframes ebimgfade{from{opacity:0}to{opacity:1}}
  .ebimg-sh{width:100%;max-width:470px;background:var(--surface);border:1px solid var(--line);border-bottom:0;
    border-radius:22px 22px 0 0;padding:16px 16px 26px;animation:ebimgup .26s cubic-bezier(.2,.85,.25,1)}
  @keyframes ebimgup{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
  .ebimg-grab{width:38px;height:4px;border-radius:99px;background:#33332f;margin:0 auto 15px}
  .ebimg-l{font-size:11px;font-weight:800;color:var(--ink-faint);letter-spacing:.08em;margin:0 0 7px 2px}
  .ebimg-row{display:flex;gap:6px;margin-bottom:15px}
  .ebimg-row button{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-dim);border-radius:11px;
    font-family:inherit;font-size:12.5px;font-weight:700;padding:11px 4px;cursor:pointer;transition:.15s;
    display:flex;flex-direction:column;align-items:center;gap:4px}
  .ebimg-row button:hover{border-color:#3d3d38;color:var(--ink)}
  .ebimg-row button.on{background:rgba(var(--lime-rgb),.13);border-color:rgba(var(--lime-rgb),.5);color:var(--lime)}
  .ebimg-row button i{font-style:normal;font-size:15px;line-height:1}
  .ebimg-cap{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:var(--ink);
    font-family:inherit;font-size:13.5px;padding:12px 13px;outline:none;margin-bottom:15px}
  .ebimg-cap:focus{border-color:rgba(var(--lime-rgb),.4)}
  .ebimg-cap::placeholder{color:#3f3f3b}
  .ebimg-foot{display:flex;gap:8px}
  .ebimg-foot button{flex:1;border:0;border-radius:13px;font-family:inherit;font-size:14px;font-weight:800;padding:14px;cursor:pointer}
  .ebimg-del{background:rgba(255,110,110,.11);color:#ff8a8a;border:1px solid rgba(255,110,110,.24)!important;flex:0 0 96px!important}
  .ebimg-ok{background:var(--lime);color:#0b0b0b}

  /* ═══════════ ✍️ 생각 쓰기 = 홈이 그대로 이어짐 (B안) ═══════════ */
  .tk-scroll{display:flex;flex-direction:column;justify-content:center;transition:justify-content .4s}
  .tk-scroll.writing{justify-content:flex-start}
  .eb-edinner.tk-inner{max-width:640px;margin:0 auto;padding:18px 22px 48px;width:100%}
  @media(min-width:768px){.eb-edinner.tk-inner{padding:26px 40px 56px}}
  /* 홈과 같은 카드 → 쓰기 시작하면 녹아 사라짐 */
  .tk-card{background:linear-gradient(180deg,#181818,#121212);border:1px solid #2c2c2c;border-radius:22px;
    padding:20px 18px 18px;box-shadow:0 10px 34px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.03);
    transition:background .5s ease,border-color .5s ease,box-shadow .5s ease,padding .45s cubic-bezier(.3,.9,.3,1)}
  .tk-scroll.writing .tk-card{background:none;border-color:transparent;box-shadow:none;padding:0}
  .tk-mark{display:flex;flex-direction:column;align-items:center;gap:13px;margin-bottom:20px;
    transition:.45s cubic-bezier(.3,.9,.3,1)}
  .tk-scroll.writing .tk-mark{flex-direction:row;align-items:center;gap:9px;margin-bottom:14px}
  .tk-cube{width:52px;height:52px;border-radius:15px;background:var(--lime);display:grid;place-items:center;flex:0 0 auto;
    box-shadow:0 0 34px rgba(var(--lime-rgb),.24);transition:.45s cubic-bezier(.3,.9,.3,1)}
  .tk-scroll.writing .tk-cube{width:22px;height:22px;border-radius:7px;box-shadow:none}
  .tk-cube svg{width:26px;height:26px;transition:.45s cubic-bezier(.3,.9,.3,1)}
  .tk-scroll.writing .tk-cube svg{width:12px;height:12px}
  .tk-date{font-size:12.5px;color:var(--ink-faint);font-weight:700;transition:.3s}
  .tk-scroll.writing .tk-date{font-size:12px;color:var(--lime);letter-spacing:.04em}
  .eb-editor.tk-ed .eb-edbody{min-height:120px}
  .tk-scroll:not(.writing) .eb-edbody{text-align:center}
  .tk-scroll:not(.writing) .eb-edbody:empty::before{font-size:15px}
  /* 생각 정리(일기) = 앰버 */
  .tk-ed.diary .tk-cube{background:#E0B27A;box-shadow:0 0 34px rgba(224,178,122,.24)}
  .tk-ed.diary .tk-scroll.writing .tk-date{color:#E0B27A}
  .tk-ed.diary .eb-edbody{caret-color:#E0B27A}
  .tk-ed.diary .tk-card:focus-within{border-color:rgba(224,178,122,.45)}
  /* 접히는 메타 (⊕) */
  .tk-metabtn{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-dim);border-radius:9px;
    font-size:13px;font-weight:800;width:32px;height:31px;cursor:pointer;font-family:inherit;flex:0 0 auto;transition:.16s}
  .tk-metabtn:hover{border-color:#3d3d38;color:var(--ink)}
  .tk-metabtn.on{background:var(--lime);border-color:var(--lime);color:#0b0b0b}
  .tk-meta{overflow:hidden;max-height:0;opacity:0;flex:0 0 auto;
    transition:max-height .32s cubic-bezier(.4,0,.2,1),opacity .22s,padding .32s;border-bottom:1px solid transparent}
  .tk-meta.open{max-height:190px;opacity:1;padding:12px 0 14px;border-bottom-color:var(--line)}
  .tk-meta .tk-metainner{max-width:640px;margin:0 auto;padding:0 22px}
  @media(min-width:768px){.tk-meta .tk-metainner{padding:0 40px}}
  /* ── 상단 고정 서식 바 (스크롤해도 유지 · iOS 기본 메뉴와 안 겹침) ── */
  .eb-editor.tk-ed .eb-edtop{border-bottom:0;padding-bottom:8px}
  .tk-fmtbar{flex:0 0 auto;display:flex;gap:5px;padding:0 12px 9px;background:rgba(13,13,13,.96);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tk-fmtbar::-webkit-scrollbar{display:none}
  .tk-fmtbar button{flex:0 0 auto;background:var(--surface-2);border:1px solid var(--line);color:#d2d2cc;
    border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 12px;cursor:pointer;transition:.15s;
    min-width:38px;display:flex;align-items:center;justify-content:center}
  .tk-fmtbar button:hover{border-color:rgba(var(--lime-rgb),.42);color:var(--lime)}
  .tk-fmtbar button:active{transform:scale(.94)}
  .tk-fmtbar button.hl{font-size:15px;color:var(--lime)}
  .tk-fmtbar .tk-fmtdiv{flex:0 0 auto;width:1px;background:var(--line);margin:4px 3px;align-self:stretch}
  .tk-ed.diary .tk-fmtbar button:hover{border-color:rgba(224,178,122,.45);color:#E0B27A}
  .tk-ed.diary .tk-fmtbar button.hl{color:#E0B27A}
  /* A안: 🎤 음성 · 🖼 사진을 툴바 오른쪽 그룹으로 (편집툴 옆) */
  .tk-fmtbar .tk-msp{flex:1 1 8px;min-width:6px}                 /* 서식과 미디어를 밀어내는 스페이서 */
  .tk-fmtbar button.tk-mbtn{color:var(--lime);border-color:rgba(var(--lime-rgb),.34);background:rgba(var(--lime-rgb),.08);gap:4px;font-size:12px;padding:7px 11px}
  .tk-fmtbar button.tk-mbtn:hover{color:var(--lime);border-color:rgba(var(--lime-rgb),.55);background:rgba(var(--lime-rgb),.16)}
  .tk-ed.diary .tk-fmtbar button.tk-mbtn{color:#E0B27A;border-color:rgba(224,178,122,.34);background:rgba(224,178,122,.09)}
  .tk-ed.diary .tk-fmtbar button.tk-mbtn:hover{color:#E0B27A;border-color:rgba(224,178,122,.55);background:rgba(224,178,122,.17)}
  /* 전자책도 툴바가 붙으면 헤더 밑줄 제거(한 판처럼) */
  .eb-editor:has(.tk-fmtbar) .eb-edtop{border-bottom:0;padding-bottom:8px}

  /* ── 하단 바: 🎤 · 🖼 ─── 자수 ─── 저장 ── */
  .eb-editor.tk-ed .eb-edstatus{justify-content:flex-start;flex-wrap:nowrap;gap:7px;padding-top:9px;padding-bottom:calc(9px + env(safe-area-inset-bottom))}
  .tk-wcwrap{flex:1;display:flex;justify-content:center;align-items:center;gap:10px;min-width:0}
  .eb-editor.tk-ed .tk-wcwrap .eb-wc{margin-left:0;padding:0}
  .tk-photo{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-dim);border-radius:8px;
    font-size:11.5px;font-weight:700;padding:4px 10px;cursor:pointer;font-family:inherit;flex:0 0 auto;transition:.15s}
  .tk-photo:hover{border-color:rgba(var(--lime-rgb),.4);color:var(--lime)}
  .tk-save{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--lime);color:#0b0b0b;border:0;
    border-radius:999px;font-family:inherit;font-size:13px;font-weight:800;padding:9px 17px 9px 14px;cursor:pointer;
    box-shadow:0 4px 16px rgba(var(--lime-rgb),.3);transition:.18s}
  .tk-save svg{width:15px;height:15px;stroke:#0b0b0b;fill:none;stroke-width:2.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .tk-save:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(var(--lime-rgb),.46)}
  .tk-save:active{transform:scale(.95)}
  .tk-save.saved{background:#eaffa0}
  .tk-ed.diary .tk-save{background:#E0B27A;box-shadow:0 4px 16px rgba(224,178,122,.3)}
  .tk-ed.diary .tk-save:hover{box-shadow:0 6px 20px rgba(224,178,122,.46)}
  /* ＋ 서식 (평소엔 숨어 있음) */
  .tk-toolwrap{position:fixed;right:16px;bottom:18px;z-index:90;display:flex;align-items:center;gap:7px}
  .tk-toolrow{display:flex;gap:3px;background:rgba(28,28,28,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:999px;padding:4px;transform-origin:right center;
    transform:translateX(16px) scale(.88);opacity:0;pointer-events:none;transition:.27s cubic-bezier(.34,1.4,.64,1)}
  .tk-toolrow.on{transform:none;opacity:1;pointer-events:auto}
  .tk-toolrow button{background:none;border:0;color:#d6d6d0;font-family:inherit;font-size:13px;font-weight:800;
    width:33px;height:33px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
  .tk-toolrow button:hover{background:#2c2c2c}
  .tk-toolrow button.hl{color:var(--lime);font-size:15px}
  .tk-fab{width:48px;height:48px;border-radius:50%;border:0;background:var(--lime);color:#0b0b0b;font-size:20px;
    cursor:pointer;display:grid;place-items:center;flex:0 0 auto;font-family:inherit;
    box-shadow:0 7px 22px rgba(var(--lime-rgb),.3);transition:.26s cubic-bezier(.34,1.4,.64,1)}
  .tk-fab.on{transform:rotate(45deg);background:var(--surface-2);color:var(--lime);box-shadow:none}
  .tk-ed.diary .tk-fab{background:#E0B27A;box-shadow:0 7px 22px rgba(224,178,122,.3)}
  .tk-ed.diary .tk-fab.on{background:var(--surface-2);color:#E0B27A}

  /* ═══════════ 📜 목록 재설계 — 두 방 · 히어로 · 무게 3단 · 접히는 달력 ═══════════ */
  .tk-wrapx{--acc:var(--lime);--acc-rgb:var(--lime-rgb)}
  .tk-wrapx.diary{--acc:#E0B27A;--acc-rgb:224,178,122}
  /* 상단: 방 전환 + 달력 아이콘 */
  .tk-top2{display:flex;align-items:center;gap:9px;max-width:560px;margin:0 auto 14px}
  .tk-rooms2{display:flex;gap:3px;background:#131313;border:1px solid #212121;border-radius:999px;padding:3px;flex:1;min-width:0}
  .tk-rooms2 button{flex:1;background:none;border:0;color:var(--ink-dim);font-family:inherit;font-size:12.5px;font-weight:800;
    padding:8px 6px;border-radius:999px;cursor:pointer;transition:.2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tk-rooms2 button.on{background:rgba(var(--lime-rgb),.15);color:var(--lime);box-shadow:inset 0 0 0 1px rgba(var(--lime-rgb),.4)}
  .tk-rooms2 button.dia.on{background:rgba(224,178,122,.15);color:#E0B27A;box-shadow:inset 0 0 0 1px rgba(224,178,122,.45)}
  .tk-calbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-dim);cursor:pointer;display:grid;place-items:center;transition:.2s;flex:0 0 auto}
  .tk-calbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tk-calbtn:hover{border-color:rgba(var(--acc-rgb),.45);color:var(--acc)}
  .tk-calbtn.on{background:var(--acc);border-color:var(--acc);color:#0b0b0b}
  .tk-caldot{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--acc);
    box-shadow:0 0 6px rgba(var(--acc-rgb),.85);transition:.2s}
  .tk-calbtn.on .tk-caldot{opacity:0}
  /* 접히는 달력 */
  .tk-calwrap{overflow:hidden;max-height:0;opacity:0;max-width:560px;margin:0 auto;
    transition:max-height .36s cubic-bezier(.4,0,.2,1),opacity .24s,margin .3s}
  .tk-calwrap.open{max-height:460px;opacity:1;margin-bottom:16px}
  .tk-calwrap .tk-cal{margin:0 auto}   /* 560px 래퍼 안에서 달력(420px) 중앙 정렬 */
  /* ═══ 목록 상단: 검색 · 필터 칩 · 쌓인 개수 ═══ */
  .tk-srch{max-width:560px;margin:0 auto 9px;display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 11px;
    transition:border-color .16s,box-shadow .16s}
  .tk-srch:focus-within{border-color:rgba(var(--acc-rgb),.5);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.1)}
  .tk-srch.has{border-color:rgba(var(--acc-rgb),.42)}
  .tk-srch-ic{font-size:12.5px;opacity:.65;flex:0 0 auto}
  .tk-srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font-family:inherit;
    font-size:13.5px;font-weight:600;padding:11px 0;-webkit-appearance:none}
  .tk-srch input::placeholder{color:#5b5e56;font-weight:600}
  .tk-srch input::-webkit-search-cancel-button{display:none}
  .tk-srch-x{flex:0 0 auto;background:rgba(255,255,255,.08);border:0;color:var(--ink-dim);border-radius:50%;
    width:20px;height:20px;font-size:10px;font-weight:900;cursor:pointer;display:grid;place-items:center}
  .tk-srch-x:hover{background:#d9455f;color:#fff}
  .tk-chips{max-width:560px;margin:0 auto 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
  .tk-chips::-webkit-scrollbar{display:none}
  .tk-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;background:var(--surface);
    border:1px solid var(--line);color:var(--ink-dim);border-radius:999px;font-family:inherit;font-size:12px;
    font-weight:800;padding:6px 12px;cursor:pointer;transition:.15s;white-space:nowrap}
  .tk-chip i{font-style:normal;font-size:10.5px;font-weight:800;opacity:.6;font-variant-numeric:tabular-nums}
  .tk-chip:hover{border-color:rgba(var(--acc-rgb),.4);color:var(--acc)}
  .tk-chip.on{background:rgba(var(--acc-rgb),.15);border-color:rgba(var(--acc-rgb),.45);color:var(--acc)}
  .tk-chip.on i{opacity:.85}
  .tk-chip.date em{font-style:normal;margin-left:2px;opacity:.7;font-size:10px}
  .tk-cnt{max-width:560px;margin:0 auto 14px;font-size:11px;font-weight:800;color:var(--ink-faint);
    letter-spacing:.02em;padding-left:2px}
  .tk-cnt b{color:var(--acc);font-size:12.5px}
  /* 검색어 강조 */
  mark.tk-hit{background:rgba(var(--acc-rgb),.26);color:var(--ink);border-radius:3px;padding:0 2px}
  /* 날짜 머리 (스크롤해도 붙어 있음) */
  .tk-dayhd{max-width:560px;margin:0 auto 12px;font-size:10.5px;font-weight:800;color:var(--ink-faint);letter-spacing:.12em;padding-left:2px}
  .tk-dayhd.sticky{position:sticky;top:0;z-index:6;margin-top:16px;padding:7px 2px 7px 2px;
    background:linear-gradient(180deg,var(--bg) 62%,transparent);display:flex;align-items:center;gap:7px}
  .tk-dayhd.sticky:first-of-type{margin-top:0}
  .tk-dayhd .n{font-size:9.5px;font-weight:800;color:var(--ink-faint);background:rgba(255,255,255,.06);
    border-radius:999px;padding:1.5px 6px;letter-spacing:0}
  /* 유형색 = 카드 왼쪽 엣지 (작은 칩만으론 안 보이던 것) */
  .tk-card.hascat{border-left:3px solid var(--cat)}
  .tk-card.hascat .tk-wbar{background:var(--cat);opacity:.5}
  .tk-hero.hascat{border-left:3px solid var(--cat)}
  /* ── 히어로 ── */
  .tk-hero{max-width:560px;margin:0 auto 20px;border:1px solid rgba(var(--acc-rgb),.24);border-radius:20px;
    padding:22px 20px 18px;cursor:pointer;position:relative;overflow:hidden;transition:.2s;
    background:radial-gradient(125% 100% at 50% 0%,rgba(var(--acc-rgb),.075),transparent 62%)}
  .tk-hero:hover{border-color:rgba(var(--acc-rgb),.44);transform:translateY(-1px)}
  .tk-hero-k{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:900;color:var(--acc);letter-spacing:.13em;margin-bottom:13px}
  .tk-hero-k i{width:5px;height:5px;border-radius:50%;background:var(--acc);display:block;box-shadow:0 0 8px rgba(var(--acc-rgb),.9)}
  .tk-hero-q{font-size:21px;font-weight:800;line-height:1.45;letter-spacing:-.035em;text-wrap:balance;margin-bottom:12px}
  .tk-wrapx.diary .tk-hero-q{font-weight:700;letter-spacing:-.025em}
  .tk-hero-b{font-size:13.5px;color:#a9ada2;line-height:1.72;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tk-hero-f{display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--ink-faint);font-weight:700;
    margin-top:15px;padding-top:13px;border-top:1px solid #1e1e1e}
  .tk-hero-f .sp{margin-left:auto}
  /* ── 무게 3단 카드 (숫자 클수록 무겁다) ── */
  .tk-card{max-width:560px;margin:0 auto 10px;cursor:pointer;padding:15px 16px;border-radius:15px;position:relative;
    overflow:hidden;background:var(--surface);border:1px solid #212121;transition:.16s}
  .tk-card:hover{border-color:rgba(var(--acc-rgb),.32);transform:translateY(-1px)}
  .tk-card-t{font-weight:800;letter-spacing:-.02em;line-height:1.42;text-wrap:balance}
  .tk-card-b{color:var(--ink-dim);line-height:1.68;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
  .tk-card-f{font-size:10.5px;color:var(--ink-faint);margin-top:10px;display:flex;align-items:center;gap:8px;font-weight:700}
  .tk-card-f .sp{margin-left:auto}
  .tk-wbar{position:absolute;left:0;top:13px;bottom:13px;width:2.5px;border-radius:99px;background:var(--acc)}
  .tk-card.w3{padding:19px 18px}
  .tk-card.w3 .tk-card-t{font-size:16.5px;margin-top:8px;margin-bottom:7px}
  .tk-card.w3 .tk-card-b{font-size:13.5px;-webkit-line-clamp:2}
  .tk-card.w3 .tk-wbar{opacity:.42}
  .tk-card.w2 .tk-card-t{font-size:14.5px;margin-top:7px;margin-bottom:5px}
  .tk-card.w2 .tk-card-b{font-size:12.5px;-webkit-line-clamp:1}
  .tk-card.w2 .tk-wbar{opacity:.24}
  .tk-card.w1{padding:12px 15px 12px 15px;background:#101010;display:flex;align-items:center;gap:9px}
  .tk-card.w1 .tk-card-t{font-size:13.5px;font-weight:700;color:#c3c6bc;margin:0;flex:1;min-width:0;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .tk-card.w1 .tk-card-b,.tk-card.w1 .tk-card-f{display:none}
  .tk-card.w1 .tk-wbar{opacity:.13}
  .tk-card.w1 .tk-tm{font-size:10px;color:var(--ink-faint);flex:0 0 auto;font-weight:700}
  .tk-card.faved{border-color:rgba(255,210,74,.42);background:linear-gradient(165deg,#1a1710,#131210)}
  .tk-card.faved .tk-wbar{background:#ffd24a;opacity:.7}
  /* 별 버튼 (카드 오른쪽 위) */
  .tk-card .tk-star,.tk-hero .tk-star{position:absolute;top:9px;right:9px;z-index:3;background:#111;border:0;
    width:26px;height:26px;border-radius:8px;color:#ffd24a;font-size:13px;cursor:pointer;line-height:1;padding:0}
  .tk-card.w1 .tk-star{position:static;width:auto;height:auto;background:none;font-size:11px}
  .tk-card.w3 .tk-card-t,.tk-card.w2 .tk-card-t{padding-right:26px}
  .tk-hero-q{padding-right:30px}
  /* 형광 미리보기 */
  .tk-pvhl{background:rgba(var(--acc-rgb),.17);color:var(--acc);border-radius:3px;padding:0 3px}
  .tk-emptyday{max-width:560px;margin:0 auto;text-align:center;color:var(--ink-faint);font-size:13px;padding:44px 0;line-height:1.85}
  .tk-cattag2{display:inline-block;font-size:10px;font-weight:800;border-radius:5px;padding:2.5px 7px;vertical-align:1px}
  /* 🏃/📖 꼬리표 — 카드 크기와 무관하게 «시간 옆 같은 자리·같은 크기» (2026-07-27 통일) */
  .tk-flag{display:inline-flex;align-items:center;flex:0 0 auto;font-size:9.5px;font-weight:800;
    border-radius:5px;padding:2.5px 7px;margin-left:6px;letter-spacing:-.01em;white-space:nowrap;line-height:1.35}
  .tk-flag.run{background:rgba(var(--lime-rgb),.13);color:#b6d94f}
  .tk-flag.ebox{background:rgba(122,184,255,.14);color:#7ab8ff}
  .tk-flag.done{background:rgba(255,255,255,.08);color:#8b8f83}

  /* ═══ 기록 인식 — 썸네일 · 무드 · 펼쳐보기(peek) ═══ */
  .tk-cmain{display:flex;gap:12px;align-items:flex-start}
  .tk-thumb{flex:0 0 54px;height:68px;border-radius:11px;background-size:cover;background-position:center;
    background-color:#0e0e0e;box-shadow:0 3px 10px rgba(0,0,0,.4)}
  .tk-thumb.txt{display:flex;align-items:center;justify-content:center;font-size:22px;
    background:linear-gradient(150deg,#1c1c1c,#141414)}
  .tk-card.w3 .tk-thumb{flex-basis:60px;height:78px}
  .tk-ccol{flex:1;min-width:0}
  .tk-mood2{font-size:15px;line-height:1;margin-right:5px;vertical-align:-1px}
  .tk-chev{position:absolute;bottom:11px;right:12px;color:var(--ink-faint);font-size:10px;transition:transform .25s;pointer-events:none}
  .tk-card.open .tk-chev,.tk-hero.open .tk-chev{transform:rotate(180deg)}
  .tk-peek{max-height:0;opacity:0;overflow:hidden;
    transition:max-height .32s cubic-bezier(.3,.9,.3,1),opacity .22s,margin .32s}
  .tk-card.open .tk-peek,.tk-hero.open .tk-peek{max-height:440px;opacity:1;margin-top:13px}
  .tk-card.open,.tk-hero.open{border-color:rgba(var(--acc-rgb),.45)}
  /* 본문만 스크롤 · 「수정하기」 버튼은 스크롤 밖(항상 보임) */
  .tk-peek .pk-scroll{max-height:330px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .tk-peek .pk-scroll::-webkit-scrollbar{width:0}
  .tk-peek .pk-img{width:100%;max-height:190px;object-fit:cover;border-radius:12px;margin-bottom:11px;display:block}
  .tk-peek .pk-txt{font-size:13.5px;line-height:1.82;color:#d0d1c9;word-break:break-word}
  .tk-peek .pk-txt mark,.tk-peek .pk-txt .eb-hl{background:rgba(var(--acc-rgb),.18);color:var(--acc);border-radius:3px;padding:0 3px}
  .tk-peek .pk-open{margin-top:12px;width:100%;border:0;border-radius:12px;background:rgba(var(--acc-rgb),.16);
    color:var(--acc);font-family:inherit;font-size:13.5px;font-weight:800;padding:12px;cursor:pointer;transition:.16s;
    display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.3)}
  .tk-peek .pk-open:hover{background:rgba(var(--acc-rgb),.24)}
  .tk-card.w3 .tk-card-t,.tk-card.w2 .tk-card-t{padding-right:34px}   /* 셰브론 자리 */

  /* ═══ 편집기 제목 헤어라인 + 형광 모드 ═══ */
  .eb-editor.tk-ed{--acc:#C8FF00;--acc-rgb:200,255,0}
  .eb-editor.tk-ed.diary{--acc:#E0B27A;--acc-rgb:224,178,122}
  .tk-title{outline:none;text-align:left;font-size:20px;font-weight:800;letter-spacing:-.025em;color:var(--ink);
    min-height:1.5em;line-height:1.45;caret-color:var(--acc);padding-bottom:9px;margin-bottom:13px;
    border-bottom:1px solid rgba(var(--acc-rgb),.32)}
  .tk-title:empty::before{content:'제목 — 비우면 첫 줄이 제목이 돼요';color:#3a3a36;font-weight:800}
  .tk-scroll:not(.writing) .tk-title{text-align:center}
  .tk-fmtbar button.hl.on{background:rgba(var(--acc-rgb),.18);border-color:rgba(var(--acc-rgb),.5);color:var(--acc)}
  /* 드래그(선택) 중 = 지금 누르면 바로 칠해진다는 신호 */
  .tk-fmtbar button.hl.sel{background:rgba(var(--acc-rgb),.16);border-color:rgba(var(--acc-rgb),.55);color:var(--acc);
    box-shadow:0 0 8px rgba(var(--acc-rgb),.18)}
  .eb-editor.tk-ed.hlmode #thinkBody{cursor:crosshair}
  .tk-hlnudge{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:70;
    background:rgba(var(--acc-rgb),.16);border:1px solid rgba(var(--acc-rgb),.4);color:var(--acc);
    font-size:12px;font-weight:800;padding:7px 14px;border-radius:999px;pointer-events:none;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:tkfade .2s}
  @keyframes tkfade{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%)}}

  /* ═══════════ 🧊 콘텐츠 유리 레일 — 안개 팔레트 · 불빛 강 · 점만 ═══════════ */
  /* 광원이 화면 밖으로 새지 않게 — hidden은 sticky를 죽이므로 clip */
  .ir-lay{display:flex;gap:18px;align-items:flex-start;position:relative;overflow-x:clip;overflow-y:visible}
  .ir-lay::before,.ir-lay::after{content:'';position:absolute;border-radius:50%;pointer-events:none;z-index:0;filter:blur(10px)}
  .ir-lay::before{width:460px;height:460px;left:-150px;top:-120px;
    background:radial-gradient(circle,rgba(188,222,85,.5),transparent 64%);opacity:.13}
  .ir-lay::after{width:400px;height:400px;right:-130px;top:34%;
    background:radial-gradient(circle,rgba(143,174,207,.5),transparent 66%);opacity:.09}
  .ir-rail,.ir-main{position:relative;z-index:1}
  .ir-rail{flex:0 0 244px;border-radius:22px;padding:11px;align-self:flex-start;position:sticky;top:12px;
    background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 26px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16);
    display:flex;flex-direction:column;gap:2px}
  .ir-i{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;cursor:pointer;
    font-size:14px;font-weight:700;color:rgba(255,255,255,.72);transition:background .16s;position:relative}
  .ir-i:hover{background:rgba(255,255,255,.045)}
  .ir-i .ird{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:currentColor;
    box-shadow:0 0 9px currentColor}
  .ir-i .irl{flex:1;color:rgba(255,255,255,.86);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ir-i .irn{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.32);font-variant-numeric:tabular-nums}
  .ir-i.on{background:linear-gradient(96deg,rgba(188,222,85,.11),rgba(188,222,85,.02) 62%,transparent);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .ir-i.on .irl{color:#fff}
  .ir-i.on .irn{color:rgba(255,255,255,.58)}
  .ir-i.fixed{background:linear-gradient(96deg,rgba(188,222,85,.06),transparent 70%)}
  .ir-i.fixed.on{background:linear-gradient(96deg,rgba(188,222,85,.17),rgba(188,222,85,.03) 62%,transparent);
    box-shadow:inset 0 0 0 1px rgba(188,222,85,.22)}
  .ir-i .irpin{font-size:10px;color:rgba(255,255,255,.26);flex:0 0 auto}
  .ir-i .irm{display:none;flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:0;cursor:pointer;
    background:rgba(255,90,90,.14);color:#ff8a8a;font-size:14px;font-family:inherit;line-height:1;padding:0}
  .ir-rail.editing .ir-i:not(.fixed) .irm{display:block}
  .ir-rail.editing .ir-i:not(.fixed) .irn{display:none}
  .ir-div{height:1px;background:rgba(255,255,255,.06);margin:9px 10px}
  .ir-add,.ir-edit{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:13px;cursor:pointer;
    background:none;border:0;font-family:inherit;width:100%;text-align:left;transition:.16s}
  .ir-add{font-size:13.5px;font-weight:700;color:rgba(255,255,255,.32)}
  .ir-add:hover{color:#BCDE55;background:rgba(188,222,85,.06)}
  .ir-edit{font-size:12px;font-weight:700;color:rgba(255,255,255,.28)}
  .ir-edit:hover{color:#fff;background:rgba(255,255,255,.05)}
  .ir-edit.on{color:#BCDE55}
  .ir-main{flex:1;min-width:0}
  .ir-head{display:flex;align-items:center;gap:11px;margin-bottom:15px;flex-wrap:wrap}
  .ir-head .irh-d{width:11px;height:11px;border-radius:50%;background:currentColor;box-shadow:0 0 9px currentColor;flex:0 0 auto}
  .ir-head h2{font-size:23px;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
  .ir-head .irh-s{font-size:12.5px;color:var(--ink-faint);font-weight:600}
  @media(max-width:820px){
    .ir-lay{flex-direction:column;gap:12px}
    .ir-rail{position:static;flex:0 0 auto;width:100%;flex-direction:row;overflow-x:auto;overflow-y:hidden;
      border-radius:16px;padding:9px 10px;gap:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .ir-rail::-webkit-scrollbar{display:none}
    .ir-i{padding:8px 13px;border:1px solid rgba(255,255,255,.08);border-radius:999px;font-size:12.5px;gap:8px;flex:0 0 auto}
    .ir-i.on{background:rgba(188,222,85,.12);border-color:rgba(188,222,85,.4);box-shadow:none}
    .ir-div{width:1px;height:auto;margin:3px 2px;flex:0 0 auto}
    .ir-add,.ir-edit{width:auto;flex:0 0 auto;white-space:nowrap;padding:8px 12px}
  }
  /* 담기 = 유리 카드 (A안) */
  .ir-main .composer{border-radius:22px;padding:22px;
    background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 26px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16)}
  .ir-main .comp-lead{display:none}                 /* 담는 곳엔 설명 문구 불필요 */
  .ir-main .field-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.085);border-radius:14px}
  .ir-main .field-box:focus-within{border-color:rgba(188,222,85,.42)}
  .ir-main .photo-card{border-color:rgba(188,222,85,.3);background:rgba(188,222,85,.03)}
  .ir-main .photo-card:hover{border-color:rgba(188,222,85,.52)}
  .ir-main .up-plus{background:rgba(188,222,85,.13);color:#BCDE55;box-shadow:0 0 26px rgba(188,222,85,.2)}
  .ir-main .comp-more-toggle{color:rgba(255,255,255,.34)}
  /* 삭제 확인 시트 */
  .irdel-ov{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.6);
    -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
    display:flex;align-items:center;justify-content:center;padding:20px;animation:irfade .18s}
  @keyframes irfade{from{opacity:0}to{opacity:1}}
  .irdel{width:100%;max-width:390px;border-radius:22px;padding:24px;
    background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 32px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2);
    animation:irup .24s cubic-bezier(.2,.85,.25,1)}
  @keyframes irup{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
  .irdel .iri{width:46px;height:46px;border-radius:14px;background:rgba(255,90,90,.14);
    display:grid;place-items:center;font-size:22px;margin-bottom:15px}
  .irdel b{display:block;font-size:18px;font-weight:800;letter-spacing:-.03em;margin-bottom:9px;line-height:1.4}
  .irdel p{font-size:13.5px;color:var(--ink-dim);line-height:1.8}
  .irdel p em{font-style:normal;color:#ff8a8a;font-weight:800}
  .irdel .iropts{margin:17px 0 4px;display:flex;flex-direction:column;gap:8px}
  .irdel .iropt{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:13px;cursor:pointer;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);transition:.16s}
  .irdel .iropt:hover{border-color:rgba(188,222,85,.4)}
  .irdel .iropt.on{border-color:rgba(188,222,85,.55);background:rgba(188,222,85,.07)}
  .irdel .iropt .irok{width:17px;height:17px;border-radius:50%;border:2px solid rgba(255,255,255,.22);flex:0 0 auto;margin-top:2px}
  .irdel .iropt.on .irok{border-color:#BCDE55;background:#BCDE55;box-shadow:0 0 10px rgba(188,222,85,.5)}
  .irdel .iropt span{font-size:13px;font-weight:700}
  .irdel .iropt small{display:block;font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-top:3px;line-height:1.6}
  .irdel .iract{display:flex;gap:9px;margin-top:16px}
  .irdel .iract button{flex:1;border:0;border-radius:14px;font-family:inherit;font-size:14px;font-weight:800;padding:14px;cursor:pointer}
  .irdel .ircancel{background:rgba(255,255,255,.07);color:rgba(255,255,255,.7)}
  .irdel .irgo{background:#ff5c5c;color:#fff}
  @supports not (backdrop-filter:blur(1px)){
    .ir-rail,.ir-main .composer,.irdel{background:rgba(24,26,22,.95)}
  }

  /* ═══════════ 🍎 애플 폴리시 5종 ═══════════ */
  /* #1 시트 재질화 — 블러+스케일 스프링 등장 */
  @keyframes tkMat{from{transform:translateY(28px) scale(.972);opacity:.3;filter:blur(6px)}
    to{transform:none;opacity:1;filter:blur(0)}}
  .eb-sheet .eb-sheetc{animation:tkMat .34s cubic-bezier(.22,1.02,.32,1)}
  .eb-dragging{transition:none!important;will-change:transform}
  /* #2 스크롤 가장자리 페이드 (편집기 상단) */
  .eb-editor.tk-ed .tk-scroll{position:relative}
  .tk-scroll-fade{position:absolute;left:0;right:0;top:0;height:24px;z-index:6;pointer-events:none;
    background:linear-gradient(rgba(13,13,13,.92),rgba(13,13,13,0));opacity:0;transition:opacity .25s}
  .tk-scroll-fade.on{opacity:1}
  /* #4 저장·주요 버튼 즉각 눌림 */
  .tk-save,.pk-open,.irgo,.ircancel,.ebimg-ok,.ebimg-del{transition:transform .12s ease-out,background .18s,box-shadow .18s}
  .tk-save:active,.pk-open:active,.irgo:active,.ircancel:active,.ebimg-ok:active,.ebimg-del:active,.tk-fab:active{transform:scale(.95)}
  /* #5 큰 제목 음수 트래킹 통일 */
  .tk-hero-q,.tk-card.w3 .tk-card-t,.ir-head h2,.irdel b,.eb-sheeth{letter-spacing:-.03em}
  /* #3 동작 줄이기(reduced-motion) */
  @media (prefers-reduced-motion:reduce){
    .eb-sheet .eb-sheetc,.ebimg-sh,.eb-insheet,.irdel,.ritual-ov,.tk-hlnudge,.nh-shot{animation:none!important}
    .ir-lay::before,.ir-lay::after{animation:none!important}
    .tk-cube,.tk-mark,.tk-card,.tk-hero,.tk-fab,.tk-toolrow,.tk-save{transition:none!important}
    .tk-peek,.tk-meta,.tk-calwrap,.tk-title{transition:opacity .18s ease!important}
  }

  /* ═══════════ 🏃 아이디어 실행 모음 — 러너 담기 버튼 + 완료 ═══════════ */
  :root{--rspring:linear(0,.42,.83,1.12,1.24,1.25,1.19,1.08,1,.97,.99,1.005,1)}
  .cc-runner{position:absolute;right:8px;bottom:8px;z-index:4;width:34px;height:34px;border-radius:50%;
    background:#0f120c;border:1.5px solid rgba(var(--lime-rgb),.5);cursor:pointer;display:grid;place-items:center;
    box-shadow:0 0 10px rgba(var(--lime-rgb),.15),inset 0 0 8px rgba(var(--lime-rgb),.05);transition:transform .18s,border-color .2s}
  .cc-runner:hover{border-color:rgba(var(--lime-rgb),.8)}
  .cc-runner:active{transform:scale(.9)}
  .cc-runner svg{width:19px;height:19px;overflow:visible;position:relative;z-index:3}
  .cc-runner svg *{stroke:var(--lime);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .cc-runner .cc-orbit{position:absolute;inset:4px;border-radius:50%;pointer-events:none;animation:ccorbit 4.5s linear infinite;animation-play-state:paused}
  .ccard:hover .cc-runner .cc-orbit{animation-play-state:running}
  .cc-runner .cc-orbit::after{content:'';position:absolute;top:-2px;left:50%;width:4px;height:4px;border-radius:50%;
    background:var(--lime);box-shadow:0 0 6px var(--lime);transform:translateX(-50%)}
  @keyframes ccorbit{to{transform:rotate(360deg)}}
  .cc-runner .cc-ripple{position:absolute;inset:0;border-radius:50%;border:2px solid var(--lime);opacity:0;pointer-events:none}
  .cc-runner.filed{animation:ccinhale .5s var(--rspring)}
  @keyframes ccinhale{0%{transform:scale(1)}25%{transform:scale(.72)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  .cc-runner.filed .cc-ripple{animation:ccripple .55s ease-out}
  @keyframes ccripple{0%{transform:scale(.9);opacity:.6}100%{transform:scale(2);opacity:0}}
  .cc-runner.filed svg{animation:ccdash .5s cubic-bezier(.4,0,.3,1),ccdashback .3s var(--rspring) .5s both}
  @keyframes ccdash{0%{transform:translateX(0)}45%{transform:translateX(-3px)}100%{transform:translateX(18px);opacity:0}}
  @keyframes ccdashback{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
  .cc-runflag{position:absolute;right:8px;bottom:8px;z-index:4;font-size:10px;font-weight:800;border-radius:8px;padding:5px 8px;cursor:pointer;border:0;font-family:inherit}
  .cc-runflag.inq{color:var(--lime);background:rgba(var(--lime-rgb),.12);border:1px solid rgba(var(--lime-rgb),.3)}
  .cc-runflag.done{color:#8FC7B8;background:rgba(143,199,184,.12)}
  /* 📥 전자책 미분류 인박스 (재료 서랍과 구분) */
  .eb-inbox{border-color:rgba(var(--lime-rgb),.26)!important;background:linear-gradient(160deg,rgba(var(--lime-rgb),.05),transparent 70%)}
  .eb-inbox .eb-mh{color:var(--lime)}
  .ds-ebox{margin-top:7px}

  /* ▾ 홈 메모 하단 펼침 — 유형 · 보내기 (조용하게) */
  .nh-pull{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 0 4px;cursor:pointer;position:relative}
  .nh-pull::before{content:'';position:absolute;left:14px;right:14px;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
  .nh-pull .pc{font-size:10px;color:#4a4e44;transition:transform .5s var(--rspring),color .3s}
  .nh-pull .pt{font-size:10px;font-weight:700;color:#4a4e44;transition:.3s}
  .nh-box:hover .nh-pull .pc,.nh-box:hover .nh-pull .pt{color:var(--ink-faint)}
  .nh-box.sendopen .nh-pull .pc{transform:rotate(180deg);color:var(--ink-dim)}
  .nh-box.sendopen .nh-pull .pt{opacity:0}
  .nh-unfold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .44s var(--rspring)}
  .nh-box.sendopen .nh-unfold{grid-template-rows:1fr}
  .nh-ufmask{overflow:hidden;min-height:0}
  .nh-ufin{padding:6px 2px 4px;opacity:0;transform:translateY(-5px);transition:opacity .32s,transform .42s var(--rspring)}
  .nh-box.sendopen .nh-ufin{opacity:1;transform:none}
  .nh-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
  .nh-cat{border:1px solid #2c2c2c;background:transparent;border-radius:999px;padding:6px 11px;font-size:11.5px;
    font-weight:700;color:var(--ink-dim);cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;transition:.16s}
  .nh-cat i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
  .nh-cat.on{color:var(--ink);border-color:#484848}
  /* # 키워드 태그 */
  .nh-kw{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:11px}
  .nh-kw-chips{display:flex;gap:6px;flex-wrap:wrap}
  .nh-kwc{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--lime);
    background:rgba(var(--lime-rgb),.1);border:1px solid rgba(var(--lime-rgb),.3);border-radius:999px;padding:4px 6px 4px 10px}
  .nh-kwc button{background:none;border:0;color:rgba(var(--lime-rgb),.7);font-size:12px;line-height:1;cursor:pointer;padding:0 2px}
  .nh-kw-in{flex:1;min-width:110px;background:transparent;border:0;outline:0;color:var(--ink);font-family:inherit;font-size:12.5px;padding:5px 3px}
  .nh-kw-in::placeholder{color:var(--ink-faint)}
  .nh-sendrow{display:flex;align-items:center;gap:9px;padding-top:10px;border-top:1px solid #222}
  .nh-sendrow .sl{font-size:10.5px;color:#54584e;font-weight:700;flex:1}
  .nh-sb{position:relative;width:42px;height:42px;border-radius:50%;flex:0 0 auto;cursor:pointer;display:grid;place-items:center;
    background:#0f120c;border:1.5px solid rgba(var(--lime-rgb),.45);transition:transform .18s,border-color .2s;
    box-shadow:0 0 10px rgba(var(--lime-rgb),.13)}
  .nh-sb:hover{border-color:rgba(var(--lime-rgb),.8)}
  .nh-sb:active{transform:scale(.9)}
  .nh-sb svg{width:21px;height:21px;overflow:visible;position:relative;z-index:3}
  .nh-sb svg *{stroke:var(--lime);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .nh-sb .cc-orbit{position:absolute;inset:4px;border-radius:50%;pointer-events:none;animation:ccorbit 4.5s linear infinite}
  .nh-sb .cc-orbit::after{content:'';position:absolute;top:-2px;left:50%;width:4px;height:4px;border-radius:50%;
    background:var(--lime);box-shadow:0 0 6px var(--lime);transform:translateX(-50%)}
  .nh-sb .cc-ripple{position:absolute;inset:0;border-radius:50%;border:2px solid var(--lime);opacity:0;pointer-events:none}
  .nh-sb.filed{animation:ccinhale .5s var(--rspring)}
  .nh-sb.filed .cc-ripple{animation:ccripple .55s ease-out}
  .nh-sb.filed svg{animation:ccdash .5s cubic-bezier(.4,0,.3,1)}
  .nh-sb.ebox svg{width:22px;height:22px}
  /* 🖍 홈 형광 — 드래그해야만 위 구석에 조용히 등장 (홈은 컬러 최소) */
  .nh-hl{position:absolute;top:9px;right:10px;z-index:2;display:flex;align-items:center;gap:6px;
    background:rgba(var(--lime-rgb),.05);border:1px solid rgba(var(--lime-rgb),.16);border-radius:999px;
    padding:5px 11px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:800;color:#B9C58C;
    opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .2s,transform .25s var(--rspring),color .15s}
  .nh-hl .ic{font-size:12.5px;filter:grayscale(.25) opacity(.85)}
  .nh-hl.show{opacity:1;transform:translateY(0);pointer-events:auto}
  .nh-hl:hover{color:#D8E4A8;border-color:rgba(var(--lime-rgb),.3)}
  .nh-hl:active{transform:scale(.95)}
  .nh-undo{display:none;margin:2px auto 0;background:none;border:0;font-family:inherit;font-size:10.5px;
    font-weight:700;color:#54584e;cursor:pointer;padding:4px 8px;border-radius:8px}
  .nh-undo:hover{color:var(--ink-dim);background:rgba(255,255,255,.04)}
  .nh-undo.show{display:block}
  .nh-tip{position:absolute;bottom:50px;right:0;white-space:nowrap;font-size:10px;color:var(--ink-faint);
    background:#191919;border:1px solid #2a2a2a;border-radius:99px;padding:4px 9px;opacity:0;transition:.15s;pointer-events:none}
  .nh-sb:hover .nh-tip{opacity:1}

  /* ✍️ 홈 글창 안 «제목 줄» — 얇은 선 하나 (그 위가 제목) */
  /* 홈 제목 = 애플식 조용히. 포인트 강하면 아이디어가 휘발돼서, 라임 대신 연한 중립 톤 */
  .nh-title{width:100%;background:transparent;border:0;outline:0;color:rgba(229,231,220,.92);font-family:inherit;
    font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.4;padding:2px 3px 8px;
    border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:11px;transition:border-color .25s}
  .nh-title::placeholder{color:#3a3a36;font-weight:600}
  .nh-title:focus{border-bottom-color:rgba(255,255,255,.2)}
  .nh.diary .nh-title:focus{border-bottom-color:rgba(224,178,122,.35)}

  /* ═══════════ 📌 할일 포스트잇 — 게시판 위에 꽂힌 종이 ═══════════ */
  .pin-row{margin:2px 0 18px}
  .pin-hd{font-size:10.5px;font-weight:800;color:var(--ink-faint);letter-spacing:.1em;margin-bottom:11px;
    display:flex;gap:6px;align-items:center}
  .pin-hd b{color:#E4D98F}
  .pin-hd span{font-weight:700;color:var(--ink-faint)}
  .pin-grid{display:flex;gap:13px;flex-wrap:wrap}
  .pinote{position:relative;width:152px;min-height:112px;padding:20px 12px 34px;cursor:pointer;
    background:linear-gradient(165deg,#EBDFA6,#D8CA87);color:#2b2717;border-radius:2px 2px 15px 2px;
    box-shadow:0 9px 20px rgba(0,0,0,.5);transform:rotate(-1.6deg);
    transition:transform .3s var(--rspring),box-shadow .25s}
  .pin-grid .pinote:nth-child(2n){transform:rotate(1.3deg);background:linear-gradient(165deg,#E4D89B,#D0C07B)}
  .pin-grid .pinote:nth-child(3n){transform:rotate(-.5deg)}
  .pinote:hover{transform:rotate(0) translateY(-4px);box-shadow:0 15px 30px rgba(0,0,0,.55);z-index:2}
  .pinote .pn-pin{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;
    box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 -2px 3px rgba(0,0,0,.28),inset 0 2px 2px rgba(255,255,255,.4)}
  .pinote .pn-t{font-size:12.5px;font-weight:700;line-height:1.5;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .pinote .pn-act{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:5px;justify-content:flex-end}
  .pinote .pn-b{border:0;background:rgba(0,0,0,.12);border-radius:7px;font-size:10px;font-weight:800;
    padding:4px 9px;cursor:pointer;color:#2b2717;font-family:inherit;transition:.14s}
  .pinote .pn-b:hover{background:rgba(0,0,0,.24)}
  .pinote .pn-b:active{transform:scale(.94)}
  .pinote .pn-b.off{background:none;color:#6b6142}
  .pinote.done-fly,.bd-note.done-fly{animation:pinfly .5s cubic-bezier(.4,0,.5,1) forwards}
  @keyframes pinfly{to{opacity:0;transform:rotate(9deg) translateY(-28px) scale(.85)}}
  /* ═══ 📌 실행 보드 — 코르크판 (포스트잇·실행 대기·폴라로이드가 한 판에) ═══ */
  /* ═══════════ 🎬 A 현장 — 아침 스튜디오 · 이동식 유리보드 (2026-07-27 사장님 픽) ═══════════
     방(빛·창·바닥) 안에 프레임 달린 유리판이 서 있고, 그 위에 포스트잇을 자유롭게 붙인다. */
  .bd-room{position:relative;border-radius:18px;overflow:hidden;padding:26px 16px 18px;isolation:isolate;
    background:linear-gradient(180deg,#e9e6dd 0%,#ded9cd 62%,#cdc7b8 62.3%,#bfb8a8 100%);
    box-shadow:0 26px 56px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.07)}
  .bd-win{position:absolute;left:3%;top:4%;width:26%;height:44%;border-radius:5px;pointer-events:none;
    background:linear-gradient(160deg,#fdfcf8,#e8f0f4);box-shadow:0 0 64px 30px rgba(255,255,245,.72)}
  .bd-plant{position:absolute;right:3.5%;bottom:0;width:56px;height:92px;pointer-events:none}
  .bd-plant .lf{position:absolute;bottom:24px;left:50%;width:10px;height:46px;border-radius:60% 60% 40% 40%;transform-origin:bottom center}
  .bd-plant .pot{position:absolute;bottom:0;left:12px;width:32px;height:27px;border-radius:4px 4px 9px 9px;
    background:linear-gradient(180deg,#b9a68c,#8c7a60)}
  /* 유리판 = 실제 보드 영역 */
  .bd-board{position:relative;border-radius:7px;padding:34px 14px 14px;min-height:380px;
    background:linear-gradient(150deg,rgba(228,241,245,.62),rgba(206,224,230,.5));
    box-shadow:0 20px 34px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.62);
    isolation:isolate}
  .bd-board::before{content:'';position:absolute;inset:-8px;border-radius:11px;z-index:-2;pointer-events:none;
    box-shadow:0 0 0 5px #2b2d2f,0 0 0 6px rgba(0,0,0,.3),0 14px 26px rgba(0,0,0,.3)}
  /* 유리 반사 + 창빛이 판 위쪽에 고이는 자리(=중요) */
  .bd-board::after{content:'';position:absolute;inset:0;border-radius:7px;z-index:0;pointer-events:none;
    background:
      radial-gradient(52% 46% at 50% -6%,rgba(255,253,235,.55),transparent 68%),
      linear-gradient(118deg,transparent 34%,rgba(255,255,255,.34) 41%,transparent 50%)}
  /* 다리 · 바퀴 · 펜 트레이 */
  .bd-legs{position:relative;height:46px;margin:9px 8px 0}
  .bd-legs i{position:absolute;top:0;width:7px;height:36px;border-radius:3px;background:linear-gradient(180deg,#3a3d40,#232527)}
  .bd-legs i.l{left:8%}.bd-legs i.r{right:8%}
  .bd-legs b{position:absolute;bottom:8px;left:8%;right:8%;height:6px;border-radius:4px;background:linear-gradient(180deg,#3a3d40,#232527)}
  .bd-legs .tray{position:absolute;bottom:17px;left:22%;right:22%;height:6px;border-radius:3px;background:linear-gradient(180deg,#44484b,#2a2d2f)}
  .bd-cast{position:absolute;bottom:0;width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#5c5c5c,#191919 70%);box-shadow:0 3px 5px rgba(0,0,0,.4)}
  .bd-cast.l{left:calc(8% - 4px)}.bd-cast.r{right:calc(8% - 4px)}
  .bd-sub{position:absolute;top:11px;left:15px;z-index:3;font-size:10px;font-weight:800;letter-spacing:.06em;
    color:rgba(45,58,62,.5)}
  .bd-stuff{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
  /* 실 — 같은 유형끼리 이어짐 (밝은 판이라 톤 낮춤) */
  .bd-strings{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:hidden}
  .bd-strings path{fill:none;stroke:rgba(176,66,54,.42);stroke-width:1.5;stroke-linecap:round;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
  /* ═══ 포스트잇 — 색 6종 (색=유형) · 중요도 3단 ═══ */
  .bd-pc{--pc1:#ffe98f;--pc2:#f5d95f;--pcInk:#2b2717}
  .bd-pc.c-mint{--pc1:#c8ecb4;--pc2:#a9dd93;--pcInk:#22301c}
  .bd-pc.c-rose{--pc1:#ffc2ce;--pc2:#f39dae;--pcInk:#33141d}
  .bd-pc.c-blue{--pc1:#bfe0f5;--pc2:#9cc9ea;--pcInk:#132836}
  .bd-pc.c-peach{--pc1:#ffd6ac;--pc2:#f5bd83;--pcInk:#33220f}
  .bd-pc.c-violet{--pc1:#dcd0f5;--pc2:#c3b2e8;--pcInk:#241a36}
  /* 중요 = 테두리로 «강조» (흐리게 하지 않는다 — 안 보이면 볼 이유가 없으니) */
  .bd-imp-hi{box-shadow:0 0 0 2.5px #C9822B,0 14px 26px rgba(0,0,0,.32),0 0 0 6px rgba(201,130,43,.16)!important;z-index:9!important}
  .bd-imp-hi .bd-lb{color:#9a6a1e}
  /* 나중 = 조금 작게만 (읽히는 건 그대로) */
  .bd-imp-lo{transform:scale(.84);transform-origin:top left}
  /* ═══ 유리 위 팝오버 — 애플식으로 부드럽게 ═══ */
  .bd-pop{position:absolute;z-index:60;width:224px;padding:13px;border-radius:16px;color:#2b2f2a;
    background:rgba(252,251,246,.97);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
    box-shadow:0 20px 42px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.06);
    opacity:0;transform:scale(.9) translateY(-6px);transform-origin:top left;pointer-events:none;
    transition:opacity .18s ease,transform .34s cubic-bezier(.22,1.4,.36,1)}
  .bd-pop.on{opacity:1;transform:none;pointer-events:auto}
  .bd-pop::after{content:'';position:absolute;top:-6px;left:24px;width:13px;height:13px;transform:rotate(45deg);
    background:rgba(252,251,246,.97)}
  .bd-pop .pl{font-size:10px;font-weight:900;color:#7c8378;letter-spacing:.05em;margin-bottom:7px}
  .bd-pop .segs{display:flex;gap:4px;margin-bottom:13px}
  .bd-pop .segs button{flex:1;font-family:inherit;font-size:11.5px;font-weight:800;color:#6a7167;background:#ecebe1;
    border:0;border-radius:9px;padding:9px 0;cursor:pointer;transition:.16s}
  .bd-pop .segs button.on{background:#2b2f2a;color:#fff}
  .bd-pop .segs button.on[data-imp="hi"]{background:#C9822B}
  .bd-pop .cols{display:flex;gap:6px;margin-bottom:13px}
  .bd-pop .cols button{flex:1;height:28px;border:0;border-radius:8px;cursor:pointer;padding:0;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:.16s}
  .bd-pop .cols button.on{box-shadow:inset 0 0 0 2.5px #2b2f2a,0 3px 8px rgba(0,0,0,.2);transform:translateY(-1px)}
  .bd-pop .okb{width:100%;background:#2b2f2a;color:#fff;border:0;border-radius:11px;font-family:inherit;
    font-size:12.5px;font-weight:800;padding:11px;cursor:pointer;transition:transform .14s}
  .bd-pop .okb:active{transform:scale(.97)}
  .bd-popscrim{position:fixed;inset:0;z-index:55}
  .bd-tack{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;
    box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 -2px 3px rgba(0,0,0,.28),inset 0 2px 2px rgba(255,255,255,.4)}
  .bd-note{position:relative;width:150px;min-height:108px;padding:16px 12px 36px;cursor:pointer;
    background:linear-gradient(165deg,#EBDFA6,#D8CA87);color:#2b2717;border-radius:2px 2px 14px 2px;
    box-shadow:0 9px 20px rgba(0,0,0,.45);transform:rotate(-2deg);transition:transform .3s var(--rspring)}
  .bd-note:nth-child(2n){transform:rotate(1.6deg);background:linear-gradient(165deg,#E4D89B,#CFC07A)}
  .bd-note:hover{transform:rotate(0) translateY(-4px);z-index:3}
  .bd-t{font-size:12.5px;font-weight:700;line-height:1.5;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .bd-lb{position:absolute;bottom:9px;left:11px;font-size:9px;font-weight:800;color:#6b6142}
  .bd-act{position:absolute;bottom:5px;right:7px;display:flex;gap:4px}
  .bd-b{border:0;background:rgba(43,39,23,.12);color:#3a3420;font-family:inherit;font-size:9.5px;font-weight:800;
    padding:3px 7px;border-radius:7px;cursor:pointer;transition:.14s}
  .bd-b:hover{background:rgba(43,39,23,.24)}
  .bd-b:active{transform:scale(.94)}
  .bd-b.off{background:transparent;color:#8a8060}
  .bd-idx{position:relative;width:184px;min-height:98px;padding:20px 13px 32px;cursor:pointer;

  .bd-pinCard.slam{animation:bdslam .5s var(--rspring)}

  .bd-stampmk{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-14deg) scale(3.4);

  /* ═══ 판 아래 «성장 바» — 종결함 + 이번 달 게이지 (하고 싶게 만드는 장치) ═══ */

  /* ═══════════ 🖼 한 프레임 구도 (PC 전용) — A안 중앙 기둥 + B안 기기 연출 ═══════════

<script>
/* ── App icon + PWA (아이디어 폴더) ── */
/* 🔆 앱 아이콘 — 로고 전구를 캔버스로 그려 생성 (base64 박아넣기 제거) */
const IDF_BULB=['M24 5.5v3.2M37.5 10.5l-2.3 2.3M10.5 10.5l2.3 2.3M6.5 23h3.2M41.5 23h-3.2','M24 12a10 10 0 0 1 6 18c-1.1.8-1.7 1.8-1.9 3.1l-.3 2.1h-7.6l-.3-2.1c-.2-1.3-.8-2.3-1.9-3.1A10 10 0 0 1 24 12Z','M21 38h6M22.5 41.5h3'];
function idfIcon(size,maskable){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  // 전면 검정 정사각(투명·라운드 없음) — 홈화면이 알아서 둥글게 자름 → 모서리 흰 테 방지
  x.fillStyle='#0D0D0D';x.fillRect(0,0,size,size);
  // 배경은 검정 유지, 중앙만 아주 은은하게
  const g=x.createRadialGradient(size/2,size*0.45,0,size/2,size*0.45,size*0.52);
  g.addColorStop(0,'rgba(200,255,0,.06)');g.addColorStop(1,'rgba(200,255,0,0)');
  x.fillStyle=g;x.fillRect(0,0,size,size);
  const box=maskable?size*0.60:size*0.74,S=box/48;
  x.save();x.translate(size/2,size/2);x.scale(S,S);x.translate(-24,-24);
  x.strokeStyle='#C8FF00';x.lineWidth=2.6;x.lineCap='round';x.lineJoin='round';
  x.shadowColor='rgba(200,255,0,.5)';x.shadowBlur=size*0.028;   // 글로우 약하게, 한 번만
  IDF_BULB.forEach(d=>x.stroke(new Path2D(d)));
  x.restore();
  try{return c.toDataURL('image/png')}catch(e){return ''}
}
const ICON192=idfIcon(192),ICON512=idfIcon(512),ICONMASK=idfIcon(512,true),FAVICON=idfIcon(64);
(function(){
  const bi=document.getElementById('brandIcon');if(bi&&bi.tagName==='IMG')bi.src=ICON512;

  fav.type='image/png';fav.href=FAVICON;

  const at=document.createElement('link');at.rel='apple-touch-icon';at.href=ICON192;document.head.appendChild(at);
  const amc=document.createElement('meta');amc.name='apple-mobile-web-app-capable';amc.content='yes';document.head.appendChild(amc);
  const amt=document.createElement('meta');amt.name='apple-mobile-web-app-title';amt.content='아이디어 폴더';document.head.appendChild(amt);
  // web manifest (blob)
  const manifest={name:'아이디어 폴더',short_name:'아이디어 폴더',start_url:'.',display:'standalone',
    background_color:'#0D0D0D',theme_color:'#0D0D0D',

      {src:ICON512,sizes:'512x512',type:'image/png'},

  const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});

})();

/* 깔끔한 벡터 전구 로고 — 어떤 크기에서도 또렷 */
const LOGO_SVG='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5.5v3.2M37.5 10.5l-2.3 2.3M10.5 10.5l2.3 2.3M6.5 23h3.2M41.5 23h-3.2"/><path d="M24 12a10 10 0 0 1 6 18c-1.1.8-1.7 1.8-1.9 3.1l-.3 2.1h-7.6l-.3-2.1c-.2-1.3-.8-2.3-1.9-3.1A10 10 0 0 1 24 12Z"/><path d="M21 38h6M22.5 41.5h3"/></svg>';
/* 홈 가운데 문양 — 테마색(var(--lime)) 타일 + 어두운 연필. 색 바꾸면 5색 전부 자동 반영 */
const EMBLEM_SVG='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect class="em-tile" x="6" y="6" width="88" height="88" rx="26"/><path class="em-pen" d="M62 28 L72 38 L46 64 L34 68 L38 56 Z" fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path class="em-pen" d="M58 32 L68 42" fill="none" stroke-width="6.5" stroke-linecap="round"/></svg>';

const WS_MAP={benchmark:'idea',reels:'idea',prompt:'idea',content:'idea',etc:'idea'};
function migrateWs(){
  let ch=false;
  store.items.forEach(it=>{ if(WS_MAP[it.ws]){ it.ws=WS_MAP[it.ws]; ch=true; } });
  if(store.groups) Object.keys(WS_MAP).forEach(old=>{
    if(store.groups[old]){ const nw=WS_MAP[old]; store.groups[nw]=store.groups[nw]||[];
      store.groups[old].forEach(g=>{ if(!store.groups[nw].includes(g)) store.groups[nw].push(g); });
      delete store.groups[old]; ch=true; }
  });
  return ch;
}

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.items){if(!s.books)s.books=[];return s}}catch{}
  return{items:[],tags:[...DEFAULT_TAGS],groups:{},books:[]}}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function host(u){try{return new URL(u).hostname.replace('www.','')}catch{return u}}
function esc(s){return(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}
function ago(ts){const t=new Date(ts);return(t.getMonth()+1)+'.'+t.getDate()}
function tally(n){ // 正 tally marks
  if(!n)return'';const full=Math.floor(n/5),rem=n%5;
  const marks=['','一','二','三','四'];
  return('正'.repeat(full)+(rem?marks[rem]:'')).trim()||'';}
/* 숨긴 칸(기본 유형을 지운 경우) */
function hidGroups(wsKey){if(!store.hidGroups)store.hidGroups={};if(!store.hidGroups[wsKey])store.hidGroups[wsKey]=[];return store.hidGroups[wsKey];}
function groupsFor(wsKey){const w=WS.find(x=>x.key===wsKey);
  const custom=store.groups[wsKey]||[];
  const hid=hidGroups(wsKey);
  return[...new Set([...(w?w.groups:[]),...custom])].filter(g=>g==='유형 미지정'||!hid.includes(g));}

const IDEA_MIST=['#BCDE55','#DB8AA0','#8FAECF','#D9A279','#B49DD0','#DBBE63','#8FC7B8','#CF9A93'];
function ideaGroupColor(g){
  if(!g||g==='유형 미지정')return '#7d8177';
  if(store.groupColors&&store.groupColors[g])return store.groupColors[g];
  let h=0;for(let i=0;i<g.length;i++)h=(h*31+g.charCodeAt(i))>>>0;
  return IDEA_MIST[h%IDEA_MIST.length];
}

function renderTabs(){
  const counts={};WS.forEach(w=>counts[w.key]=0);
  store.items.forEach(i=>{if(counts[i.ws]!==undefined)counts[i.ws]++});
  counts.home=store.items.length;
  counts.book=(store.books||[]).length;
  const bar=document.getElementById('tabbar');
  bar.innerHTML=WS.map(w=>`<button data-ws="${w.key}" class="${activeWs===w.key?'on':''}">
    ${counts[w.key]?`<span class="tb-n">${counts[w.key]}</span>`:''}
    <span class="tb-ic">${tabSvg(w.key)}</span><span class="tb-l">${w.title}</span></button>`).join('');
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{const nw=b.dataset.ws;
    if(activeWs==='home'&&nw!=='home')nhBeforeLeave();          // ✍️ 쓰던 글 절대 안 날아가게
    if(nw==='book'){bkCur=null;ebSel=null;bkCreating=false;}   // 전자책 재진입 시 항상 책장부터

    render();window.scrollTo({top:0,behavior:'smooth'})});
}

/* ── Card ── */
function isDone(i){return Array.isArray(i.tags)&&i.tags.includes('__done')}
/* 🏃 아이디어 실행 모음: __run = 실행 대기 큐 (완료되면 빠짐) */
function isRun(i){return Array.isArray(i.tags)&&i.tags.includes('__run')&&!isDone(i)}
/* 실행 모음은 워크스페이스 가리지 않음 — 홈(내 생각)에서 보낸 것도 들어옴 */
function runItems(){return store.items.filter(isRun).sort((a,b)=>b.ts-a.ts)}
/* 📌 포스트잇(할일) — 게시판 맨 위에 꽂아두고, 꽂아서 실행 */
function isPin(i){return Array.isArray(i.tags)&&i.tags.includes('__pin')&&!isDone(i)}
